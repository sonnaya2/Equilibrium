name: Apply audited reconciliation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-audited-reconcile.yml

permissions:
  contents: write

concurrency:
  group: apply-audited-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply the source-checked audit onto current main
        run: |
          git fetch origin audit-reconcile-current-main
          git show origin/audit-reconcile-current-main:scripts/reconcile-audit-data.mjs > /tmp/reconcile-audit-data.mjs
          node /tmp/reconcile-audit-data.mjs

      - name: Keep task certainty in data, not React
        run: |
          node <<'NODE'
          const fs = require('fs');

          const normalizerPath = 'scripts/normalize-scraped-data.mjs';
          let normalizer = fs.readFileSync(normalizerPath, 'utf8');
          const oldTaskBlock = `write("data/league/tasks.json", {\n  lastSynced: verifiedAt,\n  verified: false,\n  records: [],\n  tiers: equilibrium.progression.task_point_values,\n  note: "Individual Equilibrium tasks are not yet ingested. Tier point values are metadata, not fake task rows.",\n  source: leagueSource,\n});`;
          const newTaskBlock = `write("data/league/tasks.json", {\n  lastSynced: verifiedAt,\n  verified: false,\n  records: [],\n  tiers: equilibrium.progression.task_point_values,\n  tierConfidence: equilibrium.progression.task_point_value_confidence || {},\n  pointValueNote: equilibrium.progression.task_point_value_note || "Jagex has confirmed the Easy-to-Master range and 10-to-400 point bounds; any unconfirmed intermediate values stay provisional.",\n  note: "The full Equilibrium task list has not been published yet.",\n  source: leagueSource,\n});`;
          if (!normalizer.includes(oldTaskBlock)) throw new Error('tasks normalizer block changed; refusing blind patch');
          normalizer = normalizer.replace(oldTaskBlock, newTaskBlock);
          fs.writeFileSync(normalizerPath, normalizer);

          const tasksPath = 'app/tasks/page.tsx';
          let tasks = fs.readFileSync(tasksPath, 'utf8');
          tasks = tasks.replace('const PROVISIONAL_TIERS = new Set(["medium", "hard", "elite"]);\n', '');
          tasks = tasks.replace(
            /Jagex has published Easy through Master and the 10-to-400 point range\. The middle values are provisional until an Equilibrium source states them explicitly\./,
            '{tasksData.pointValueNote}'
          );
          tasks = tasks.replace(
            '{PROVISIONAL_TIERS.has(tier) ? <div className="mt-1 text-[11px] text-parch-400">provisional</div> : null}',
            '{tasksData.tierConfidence[tier]?.startsWith("provisional") ? <div className="mt-1 text-[11px] text-parch-400">provisional</div> : null}'
          );
          fs.writeFileSync(tasksPath, tasks);
          NODE

      - run: npm ci
      - run: npm run normalize:data
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Commit durable audited changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            KIMI-START.md \
            app/tasks/page.tsx \
            .github/workflows/validate.yml \
            scripts/normalize-scraped-data.mjs \
            scraped-data/ \
            data/
          if git diff --cached --quiet; then
            echo "Audit changes already present"
            exit 0
          fi
          git commit -m "Reconcile current 2026 sources and task certainty"
          git pull --rebase origin main
          git push origin HEAD:main
