# One-shot audited data enrichment. Self-removes after validation.
name: Close ED4 and Runecrafting gaps once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/close-ed4-runecrafting-gaps-once.yml

permissions:
  contents: write

concurrency:
  group: close-ed4-runecrafting-gaps-once
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add cross-boundary ED4 and Runecrafting 110 data
        run: |
          node <<'NODE'
          const fs = require('fs');
          const read = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p, v) => fs.writeFileSync(p, JSON.stringify(v, null, 2) + '\n');
          const upsert = (rows, key, row) => {
            const i = rows.findIndex((x) => x?.[key] === row[key]);
            if (i >= 0) rows[i] = { ...rows[i], ...row };
            else rows.push(row);
          };

          // ED4 is genuinely cross-boundary in base game: the dungeon entrance is in Senntisten,
          // while the final portal chain reaches the Wilderness Crater / Zamorak arena.
          // Do not force this into a single League region until Equilibrium publishes its rule.
          {
            const p = 'scraped-data/region-dependencies.json';
            const d = read(p);
            d.cross_boundary_cases ||= [];
            upsert(d.cross_boundary_cases, 'content', {
              content: 'The Zamorakian Undercity / Zamorak, Lord of Chaos',
              system: 'Elite Dungeon 4 / boss access',
              planner_status: 'unresolved_cross_boundary',
              entry_side: {
                working_region: 'misthalin',
                location: 'Senntisten',
                confidence: 'working_senntisten_misthalin_taxonomy'
              },
              final_arena_side: {
                geographic_region: 'forinthry',
                location: 'Wilderness Crater / portal to Zamorak',
                confidence: 'confirmed_wiki_geography'
              },
              planner_rule: 'Do not mark ED4/Zamorak as requiring only Misthalin or only Forinthry until Equilibrium publishes how cross-boundary dungeon/arena access is resolved. Preserve both sides as a dependency warning.',
              source_urls: [
                'https://runescape.wiki/w/Portal_(The_Zamorakian_Undercity)',
                'https://runescape.wiki/w/Update:Introducing:_Zamorak,_Lord_of_Chaos'
              ],
              evidence_note: 'The Undercity entrance/escape returns to Senntisten, while its portal chain reaches the Wilderness Crater and Zamorak. This is a real base-game boundary split, not a guess.'
            });
            write(p, d);
          }

          {
            const p = 'scraped-data/unknowns.json';
            const d = read(p);
            upsert(d.items, 'key', {
              key: 'equilibrium_ed4_zamorak_region',
              status: 'unresolved_cross_boundary',
              known: 'Base-game ED4 starts below Senntisten, but the final portal chain reaches the Wilderness Crater / Zamorak arena. The planner currently treats Senntisten as working Misthalin and Wilderness geography as Forinthry.',
              missing: ['Equilibrium rule for ED4 entry from a locked region', 'whether direct/freedom-mode Zamorak access bypasses the dungeon locality', 'whether the boss arena inherits Forinthry or the dungeon entrance region'],
              source_urls: ['https://runescape.wiki/w/Portal_(The_Zamorakian_Undercity)', 'https://runescape.wiki/w/Update:Introducing:_Zamorak,_Lord_of_Chaos']
            });
            write(p, d);
          }

          // 110 Runecrafting is established 2025 game data and materially affects region value.
          {
            const p = 'scraped-data/planner-expansions.json';
            const d = read(p);
            d.runecrafting_110_progression = {
              update_date: '2025-03-03',
              level_cap: 110,
              source_url: 'https://runescape.wiki/w/2025_Runecrafting_update',
              source_type: 'runescape_wiki',
              unlocks: [
                {
                  name: 'Time rune / Time altar',
                  level: 100,
                  region: 'anachronia',
                  location: 'north-west coast of Anachronia',
                  requirements: ['100 Runecrafting (unboostable)', 'Enchanted key'],
                  notes: 'The Time altar does not use a talisman. Time runes support the 110 Runecrafting spell additions.',
                  source_url: 'https://runescape.wiki/w/Runecrafting_altars',
                  confidence: 'confirmed_wiki'
                },
                {
                  name: 'Eternal magic wand/orb imbuing',
                  level: 100,
                  region: 'multi_region_altar_access',
                  notes: 'Inert eternal-magic weapons can be imbued with essence at most normal Runecrafting altars, creating usable tier-85-to-90 magic weapons while training Runecrafting. Exact best League route depends on selected altar access and essence supply.',
                  source_url: 'https://runescape.wiki/w/2025_Runecrafting_update',
                  confidence: 'confirmed_wiki'
                },
                {
                  name: 'Eternal magic staff imbuing',
                  level: 104,
                  region: 'multi_region_altar_access',
                  notes: 'The inert staff is Fletched from eternal magic logs, then imbued at Runecrafting altars. Elemental/catalytic altar bonuses change progress at higher Runecrafting levels.',
                  source_url: 'https://runescape.wiki/w/Eternal_magic_staff_(inert)',
                  confidence: 'confirmed_wiki'
                },
                {
                  name: 'Expansive pouch',
                  level: 105,
                  region: 'global_if_prerequisite_pouches_available',
                  capacity: 70,
                  notes: 'Non-degrading 70-essence pouch made from the previous pouch progression; it holds more essence than the older pouches combined and materially improves altar-running throughput.',
                  source_url: 'https://runescape.wiki/w/Pay-to-play_Runecrafting_training',
                  confidence: 'confirmed_wiki_item_current_rate_tables_not_used'
                },
                {
                  name: 'Masterwork staff',
                  level: 110,
                  region: 'cross_region_material_chain',
                  tier: 100,
                  magic_requirement: 99,
                  notes: 'Craftable at a Runecrafting altar. The completed staff has tier-100 accuracy/damage and Masterworked Mending, healing 2% of Magic damage dealt. Its equipment-essence material chain creates meaningful cross-region pressure in a no-trading League.',
                  source_url: 'https://runescape.wiki/w/Comparison_of_high-level_magic_weapons',
                  confidence: 'confirmed_wiki_material_chain_not_fully_region_normalized'
                }
              ],
              training_warning: 'The current Wiki Runecrafting training page still carries incomplete-rate warnings and legacy Demonic Skull figures in parts of its tables. Preserve the methods, but do not promote its XP/hour values to optimizer-grade Equilibrium rates without a current benchmark.'
            };
            write(p, d);
          }

          {
            const p = 'scraped-data/major-upgrades-by-region.json';
            const d = read(p);
            d.regions.anachronia ||= [];
            upsert(d.regions.anachronia, 'name', {
              name: 'Time altar / 110 Runecrafting',
              category: 'Runecrafting progression / time-rune spell infrastructure',
              requirements: ['100 Runecrafting', 'Enchanted key'],
              location: 'north-west coast of Anachronia',
              unlocks: ['Time runes', '110 Runecrafting spell/resource progression'],
              source_url: 'https://runescape.wiki/w/Runecrafting_altars',
              confidence: 'confirmed_wiki'
            });
            d.cross_region_upgrade_chains ||= [];
            upsert(d.cross_region_upgrade_chains, 'name', {
              name: 'Masterwork staff',
              category: 'tier-100 Magic weapon / 110 Runecrafting',
              requirements: ['110 Runecrafting', '99 Magic'],
              region_pressure: [
                'The staff is assembled at a Runecrafting altar, so the final crafting action is not tied to one elective region.',
                'Its equipment-essence/material chain draws on other high-level magic gear and therefore can create cross-region dependencies in a no-trading League.',
                'Do not assign a mandatory region set until the full material chain is normalized against Equilibrium quest/region access.'
              ],
              source_url: 'https://runescape.wiki/w/Comparison_of_high-level_magic_weapons',
              confidence: 'confirmed_wiki_cross_region_material_chain_partial'
            });
            write(p, d);
          }

          {
            const p = 'scraped-data/training-current-audit.json';
            const d = read(p);
            upsert(d.methods, 'method', {
              skill: 'Runecrafting',
              method: 'Eternal magic weapon imbuing',
              method_region: 'multi_region_altar_access',
              level_range: '100+ wands/orbs; 104+ staves',
              xp_rate: 'not optimizer-grade',
              intensity: 'lower-input weapon imbuing',
              notes: '110 Runecrafting added weapon imbuing as a less click-intensive alternative to altar running. The Wiki training page publishes estimates but explicitly flags the section as needing additional verification, so the planner keeps the method without ranking the rate.',
              freshness: '2025_update_current_method_rate_warning',
              source: 'https://runescape.wiki/w/Pay-to-play_Runecrafting_training',
              confidence: 'confirmed_wiki_method_rate_not_normalized'
            });
            upsert(d.methods, 'method', {
              skill: 'Runecrafting',
              method: 'Time runes',
              method_region: 'anachronia',
              location: 'Time altar, north-west Anachronia',
              level_range: '100+ altar access; higher-level throughput benefits apply through 110',
              xp_rate: 'not optimizer-grade',
              requirements: ['100 Runecrafting', 'Enchanted key'],
              notes: 'Time runes are the 110-era top rune unlock and the altar is region-locked to Anachronia geography. Old training tables still include removed Demonic Skull assumptions, so no current League XP/h is stored here.',
              freshness: 'current_wiki_location_stale_rate_tables',
              source: 'https://runescape.wiki/w/Runecrafting_altars',
              confidence: 'confirmed_wiki_method_rate_not_normalized'
            });
            write(p, d);
          }

          {
            const p = 'scraped-data/index.json';
            const d = read(p);
            d.coverage.runecrafting = 'altar geography plus 110 Runecrafting progression mapped, including Time altar, expansive pouch, eternal-magic weapon imbuing and Masterwork staff cross-region pressure; optimizer-grade post-2026 XP benchmarks remain pending';
            if (!d.next_ingest_priority.includes('Masterwork staff material-chain region normalization')) d.next_ingest_priority.push('Masterwork staff material-chain region normalization');
            write(p, d);
          }
          NODE
      - run: npm run normalize:data
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit validated data and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/close-ed4-runecrafting-gaps-once.yml
          git add scraped-data/ data/
          git commit -m "Map ED4 ambiguity and Runecrafting 110 progression"
          git pull --rebase origin main
          git push origin HEAD:main
