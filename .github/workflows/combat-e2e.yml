# Combat-only Playwright E2E (no map / WebGPU).
#
# Dispatch-only by default. Optional weekly schedule is off unless uncommented
# after measured local stability under CI=1.
#
# Smoke vs full combat:
#   e2e/smoke.spec.ts  — route/nav smoke (default Playwright suite / local)
#   e2e/combat.spec.ts — full combat UI E2E; this workflow is the CI path
# Full combat e2e is dispatch-only — never enabled on every push (see validate.yml).
name: Combat E2E

on:
  workflow_dispatch:
  # Optional schedule — leave commented until combat E2E is stable under CI=1.
  # schedule:
  #   - cron: "42 7 * * 3"

permissions:
  contents: read

concurrency:
  group: combat-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  combat-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Combat E2E
        id: combat-e2e
        env:
          CI: "1"
          PLAYWRIGHT_WORKERS: "1"
        run: npm run test:e2e:combat
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: combat-e2e-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 5
