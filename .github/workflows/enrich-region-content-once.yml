# One-shot region-value enrichment. This workflow removes itself after a successful validated commit.
name: Enrich region content once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/enrich-region-content-once.yml

permissions:
  contents: write

concurrency:
  group: enrich-region-content-once
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add sourced high-value region content
        run: |
          node <<'NODE'
          const fs = require('fs');
          const read = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p, v) => fs.writeFileSync(p, JSON.stringify(v, null, 2) + '\n');
          const upsert = (rows, row) => {
            const i = rows.findIndex((x) => x?.name === row.name);
            if (i >= 0) rows[i] = { ...rows[i], ...row };
            else rows.push(row);
          };
          const regionEvidence = 'https://runescape.wiki/w/Catalyst_League/Tasks';

          const regionPath = 'scraped-data/regions.json';
          const regionsDoc = read(regionPath);
          const byId = (id) => {
            const r = regionsDoc.regions.find((x) => x.id === id);
            if (!r) throw new Error(`missing region ${id}`);
            return r;
          };
          const addBoss = (id, row) => {
            const r = byId(id);
            r.bosses_and_combat ||= [];
            upsert(r.bosses_and_combat, row);
          };
          const addContent = (id, row) => {
            const r = byId(id);
            r.notable_content ||= [];
            upsert(r.notable_content, row);
          };

          const historical = 'historical_catalyst_region_mapping_current_wiki_content';
          const workingUm = 'current_wiki_location_plus_historical_city_of_um_league_taxonomy';

          addBoss('misthalin', { name: 'Kerapac, the bound', group: 'Elder God Wars Dungeon', source_url: 'https://runescape.wiki/w/Kerapac,_the_bound', region_evidence_url: regionEvidence, confidence: historical });
          addBoss('misthalin', { name: 'Arch-Glacor', group: 'Elder God Wars Dungeon', source_url: 'https://runescape.wiki/w/Arch-Glacor', region_evidence_url: regionEvidence, confidence: historical });
          addBoss('misthalin', { name: 'Croesus', group: 'Elder God Wars Dungeon / skilling boss', source_url: 'https://runescape.wiki/w/Croesus', region_evidence_url: regionEvidence, confidence: historical });
          addBoss('misthalin', { name: 'TzKal-Zuk', group: 'Elder God Wars Dungeon', source_url: 'https://runescape.wiki/w/TzKal-Zuk', region_evidence_url: regionEvidence, confidence: historical });
          addBoss('misthalin', { name: 'Rasial, the First Necromancer', group: 'City of Um / Underworld', source_url: 'https://runescape.wiki/w/Rasial,_the_First_Necromancer', region_evidence_url: regionEvidence, confidence: workingUm });
          addBoss('misthalin', { name: 'Hermod, the Spirit of War', group: 'City of Um / Underworld', note: "Hermod is fought in Rasial's Citadel above the City of Um.", source_url: 'https://runescape.wiki/w/Hermod,_the_Spirit_of_War', region_evidence_url: regionEvidence, confidence: workingUm });
          addBoss('misthalin', { name: 'Sanctum of Rebirth', group: 'City of Um access / boss dungeon', source_url: 'https://runescape.wiki/w/Sanctum_of_Rebirth', region_evidence_url: regionEvidence, confidence: workingUm });
          addBoss('misthalin', { name: 'The Gate of Elidinis', group: 'City of Um access / skilling boss', source_url: 'https://runescape.wiki/w/The_Gate_of_Elidinis', region_evidence_url: regionEvidence, confidence: workingUm });
          addBoss('misthalin', { name: 'Zemouregal & Vorkath', group: 'Fort Forinthry', source_url: 'https://runescape.wiki/w/Zemouregal_%26_Vorkath', region_evidence_url: regionEvidence, confidence: 'historical_catalyst_fort_misthalin_taxonomy_current_wiki_content' });

          addBoss('asgarnia', { name: 'Giant Mole', group: 'Falador', source_url: 'https://runescape.wiki/w/Giant_Mole', region_evidence_url: regionEvidence, confidence: historical });
          addBoss('asgarnia', { name: 'Queen Black Dragon', group: 'Port Sarim / Grotworm Lair', source_url: 'https://runescape.wiki/w/Queen_Black_Dragon', region_evidence_url: regionEvidence, confidence: historical });
          addBoss('asgarnia', { name: 'Vorago', group: 'Falador / Borehole', source_url: 'https://runescape.wiki/w/Vorago', region_evidence_url: regionEvidence, confidence: historical });
          addBoss('asgarnia', { name: 'Nex: Angel of Death', group: 'God Wars Dungeon', source_url: 'https://runescape.wiki/w/Nex:_Angel_of_Death', region_evidence_url: regionEvidence, confidence: historical });

          addBoss('kandarin', { name: 'Legiones', group: 'Monastery of Ascension', source_url: 'https://runescape.wiki/w/Legiones', region_evidence_url: regionEvidence, confidence: historical });

          addContent('forinthry', { name: 'Dragonkin Laboratory (ED2)', type: 'Elite Dungeon', note: 'Located in the Deep Wilderness Castle Ruins; contains Astellarn, Verak Lith and the Black Stone Dragon.', source_url: 'https://runescape.wiki/w/Dragonkin_Laboratory', confidence: 'confirmed_wiki_wilderness_location' });
          addContent('forinthry', { name: 'The Shadow Reef (ED3)', type: 'Elite Dungeon', note: 'Accessed from the eastern shore of Daemonheim; contains the Crassian Leviathan, Taraket and the Ambassador.', source_url: 'https://runescape.wiki/w/The_Shadow_Reef', confidence: 'confirmed_wiki_daemonheim_access' });
          addBoss('forinthry', { name: 'Corporeal Beast', group: 'Wilderness', source_url: 'https://runescape.wiki/w/Corporeal_Beast', region_evidence_url: regionEvidence, confidence: historical });
          addBoss('forinthry', { name: 'Chaos Elemental', group: 'Wilderness', source_url: 'https://runescape.wiki/w/Chaos_Elemental', region_evidence_url: regionEvidence, confidence: historical });

          addContent('desert', { name: 'Heart of Gielinor / God Wars Dungeon 2', type: 'bossing hub', source_url: 'https://runescape.wiki/w/Heart_of_Gielinor', region_evidence_url: regionEvidence, confidence: historical });
          addBoss('desert', { name: 'Telos, the Warden', group: 'Heart of Gielinor', source_url: 'https://runescape.wiki/w/Telos,_the_Warden', region_evidence_url: regionEvidence, confidence: historical });

          addBoss('morytania', { name: 'Barrows: Rise of the Six', group: 'Barrows', source_url: 'https://runescape.wiki/w/Barrows:_Rise_of_the_Six', region_evidence_url: regionEvidence, confidence: historical });
          addBoss('tirannwn', { name: 'Solak', group: 'The Lost Grove', source_url: 'https://runescape.wiki/w/Solak', region_evidence_url: regionEvidence, confidence: historical });
          addBoss('karamja', { name: 'Abomination', group: 'Brimhaven area', source_url: 'https://runescape.wiki/w/Abomination', region_evidence_url: regionEvidence, confidence: historical });
          write(regionPath, regionsDoc);

          const upgradesPath = 'scraped-data/major-upgrades-by-region.json';
          const upgrades = read(upgradesPath);
          const addUpgrade = (id, row) => {
            upgrades.regions[id] ||= [];
            upsert(upgrades.regions[id], row);
          };

          addUpgrade('misthalin', { name: 'Kerapac progression', category: 'Magic weapons / ability / scripture', examples: ['Fractured Staff of Armadyl components', 'Greater Concentrated Blast', "Kerapac's wrist wraps", 'Scripture of Jas'], source_url: 'https://runescape.wiki/w/Kerapac,_the_bound', confidence: historical });
          addUpgrade('misthalin', { name: 'Arch-Glacor progression', category: 'Melee weapons / gloves / scripture', examples: ['Frozen core of Leng', 'Dark nilas', 'Leng artefact', 'Scripture of Wen', 'enhanced glove upgrades'], source_url: 'https://runescape.wiki/w/Arch-Glacor', confidence: historical });
          addUpgrade('misthalin', { name: 'Croesus progression', category: 'Magic tank armour / skilling off-hands', examples: ['Cryptbloom armour', 'Scripture of Bik', 'Croesus foultorch', 'Croesus sporehammer'], source_url: 'https://runescape.wiki/w/Croesus', confidence: historical });
          addUpgrade('misthalin', { name: 'TzKal-Zuk progression', category: 'combat capes / melee weapon / ability / scripture', examples: ['Igneous capes', 'Ek-ZekKil', 'Magma Tempest', 'Scripture of Ful'], source_url: 'https://runescape.wiki/w/TzKal-Zuk', confidence: historical });
          addUpgrade('misthalin', { name: "First Necromancer's equipment", category: 'tier-95 Necromancy weapons and power armour', examples: ['Omni guard', 'Soulbound lantern', 'Robes of the First Necromancer'], source_url: 'https://runescape.wiki/w/First_Necromancer%27s_equipment', confidence: workingUm });
          addUpgrade('misthalin', { name: 'Gate of Elidinis uniques', category: 'prayer / skilling off-hands / scripture', examples: ['Eclipsed Soul prayer codex', 'Memory dowser', 'Runic attuner', 'Scripture of Elidinis'], source_url: 'https://runescape.wiki/w/The_Gate_of_Elidinis', confidence: workingUm });
          addUpgrade('misthalin', { name: 'Sanctum of Rebirth uniques', category: 'tier-95 Magic / prayer / scripture', examples: ['Roar of Awakening', 'Ode to Deceit', 'Divine Rage prayer codex', 'Scripture of Amascut', 'Shard of Genesis Essence'], source_url: 'https://runescape.wiki/w/Sanctum_of_Rebirth', confidence: workingUm });
          addUpgrade('misthalin', { name: 'Zemouregal & Vorkath progression', category: 'Ranged armour / Necromancy invocation', examples: ['Dracolich armour', 'Elite Dracolich armour', 'Invoke Lord of Bones'], source_url: 'https://runescape.wiki/w/Zemouregal_%26_Vorkath', confidence: 'historical_catalyst_fort_misthalin_taxonomy_current_wiki_content' });

          addUpgrade('asgarnia', { name: 'Royal crossbow', category: 'Ranged weapon progression', source: 'Queen Black Dragon', notes: 'The royal crossbow components come from QBD and the unfinished crossbow is forged using her extreme dragonfire.', source_url: 'https://runescape.wiki/w/Royal_crossbow', confidence: historical });
          addUpgrade('asgarnia', { name: 'Vorago progression', category: 'Magic weapons / tectonic armour materials', examples: ['Seismic wand', 'Seismic singularity', 'Tectonic energy'], source_url: 'https://runescape.wiki/w/Vorago', confidence: historical });
          addUpgrade('asgarnia', { name: 'Nex: Angel of Death progression', category: 'Magic weapons / prayers', examples: ['Wand of the praesul', 'Imperium core', 'Praesul codex'], source_url: 'https://runescape.wiki/w/Nex:_Angel_of_Death', confidence: historical });

          addUpgrade('kandarin', { name: 'Ascension crossbows', category: 'tier-90 Ranged weapons', source: 'Legiones', source_url: 'https://runescape.wiki/w/Ascension_crossbow', confidence: historical });

          addUpgrade('forinthry', { name: 'Dragonkin Laboratory upgrades', category: 'Melee abilities / elite tectonic materials', examples: ['Greater Fury', 'Greater Flurry', 'Greater Barge', 'Draconic energy'], source_url: 'https://runescape.wiki/w/Dragonkin_Laboratory', confidence: 'confirmed_wiki_wilderness_location' });
          addUpgrade('forinthry', { name: 'Shadow Reef progression', category: 'Ranged weapon / elite dungeon rewards', examples: ['Eldritch crossbow components'], source_url: 'https://runescape.wiki/w/The_Shadow_Reef', confidence: 'confirmed_wiki_daemonheim_access' });

          addUpgrade('morytania', { name: 'Rise of the Six progression', category: 'Melee armour / shields', examples: ['Malevolent energy', 'Malevolent armour', 'Barrows defenders/shields progression'], source_url: 'https://runescape.wiki/w/Barrows:_Rise_of_the_Six', confidence: historical });
          addUpgrade('karamja', { name: 'Abomination progression', category: 'combat uniques', source: 'Abomination', source_url: 'https://runescape.wiki/w/Abomination', confidence: historical });

          write(upgradesPath, upgrades);

          const trainingPath = 'scraped-data/training-high-value.json';
          const training = read(trainingPath);
          for (const row of training.methods || []) {
            if (row.source === 'https://patchtracker.gg/runescape/patch-notes-mid-game-rebalance') {
              row.source = 'https://secure.runescape.com/m=news/patch-notes-mid-game-rebalance';
              row.confidence = 'confirmed_official';
            }
            if (row.skill === 'Construction' && row.method === 'Fort Forinthry reinforcement') {
              row.source = 'https://secure.runescape.com/m=news/mid-game-rebalance-is-live';
            }
            if (row.skill === 'Construction' && row.method === 'Eternal magic furniture') {
              row.source = 'https://secure.runescape.com/m=news/mid-game-rebalance-is-live';
              row.confidence = 'confirmed_official';
            }
          }
          write(trainingPath, training);
          NODE
      - run: npm run normalize:data
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit validated enrichment and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/enrich-region-content-once.yml
          git add scraped-data/ data/
          git commit -m "Add missing high-value region content"
          git pull --rebase origin main
          git push origin HEAD:main
