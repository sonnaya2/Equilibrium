# One-shot expansion of the verified permanent combat unlock graph.
# Self-removes only after source validation, de-dupe audit, typecheck, tests and build pass.
name: Expand permanent unlocks once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/expand-permanent-unlocks-once.yml

permissions:
  contents: write

concurrency:
  # Serialize behind the reference-harvest salvage if it is still running.
  group: salvage-reference-harvest-once
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Bootstrap reference corpus only if missing
        run: |
          if [ ! -f scraped-data/progression-unlocks.json ] || [ ! -f scraped-data/reference-site-harvest.json ] || [ ! -f scripts/audit-reference-harvest.mjs ]; then
            git fetch origin agent/reference-site-harvest
          fi
          if [ ! -f scraped-data/progression-unlocks.json ]; then
            git show origin/agent/reference-site-harvest:scraped-data/progression-unlocks.json > scraped-data/progression-unlocks.json
          fi
          if [ ! -f scraped-data/reference-site-harvest.json ]; then
            git show origin/agent/reference-site-harvest:data/research/reference-site-harvest.json > scraped-data/reference-site-harvest.json
          fi
          if [ ! -f scripts/audit-reference-harvest.mjs ]; then
            git show origin/agent/reference-site-harvest:scripts/audit-reference-harvest.mjs > scripts/audit-reference-harvest.mjs
          fi

      - name: Add current sourced ability and prayer unlocks
        run: |
          node <<'NODE'
          const fs = require('fs');
          const read = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p, v) => fs.writeFileSync(p, JSON.stringify(v, null, 2) + '\n');
          const upsert = (rows, row) => {
            const i = rows.findIndex((x) => x?.id === row.id);
            if (i >= 0) rows[i] = row;
            else rows.push(row);
          };

          const progressionPath = 'scraped-data/progression-unlocks.json';
          const progression = read(progressionPath);
          progression.quest_unlocks = (progression.quest_unlocks || []).filter((row) => row.id !== 'succession:dive');
          progression.account_unlocks ||= [];
          progression.ability_unlocks ||= [];
          progression.prayer_unlocks ||= [];

          // July 20, 2026 rebalance removed Succession as Dive's base-game gate.
          upsert(progression.account_unlocks, {
            id: 'agility:dive',
            name: 'Dive',
            category: 'movement ability',
            access_requirements: ['30 Agility'],
            historical_requirement: 'Previously unlocked through Succession before the 20 July 2026 Mid-Game Rebalance.',
            source_url: 'https://secure.runescape.com/m=news/patch-notes-mid-game-rebalance',
            confidence: 'confirmed_official',
            league_treatment: 'Apply an explicit Equilibrium relic or passive override separately; never restore the obsolete Succession gate.'
          });

          const abilities = [
            {
              id: 'dragonkin-laboratory:greater-melee-codices',
              name: 'Dragonkin Laboratory greater melee codices',
              category: 'ability upgrades',
              region_hint: 'forinthry',
              region_status: 'confirmed_base_game_geography',
              unlocks: [
                { name: 'Greater Flurry', source: 'Astellarn' },
                { name: 'Greater Fury', source: 'Verak Lith' },
                { name: 'Greater Barge', source: 'Black Stone Dragon' }
              ],
              source_urls: [
                'https://runescape.wiki/w/Dragonkin_Laboratory',
                'https://runescape.wiki/w/Codex'
              ],
              confidence: 'confirmed_wiki',
              league_treatment: 'The dungeon is in the Wilderness. Use Forinthry for base geography, then apply any explicit Equilibrium access exception separately.'
            },
            {
              id: 'sophanem:limitless',
              name: 'Limitless',
              category: 'ability unlock',
              region_hint: 'desert',
              region_status: 'confirmed_base_game_geography',
              unlocks: [{ name: 'Limitless', source: 'Limitless ability codex' }],
              materials: [{ name: 'Vital spark', quantity: 2000 }],
              source_urls: [
                'https://runescape.wiki/w/Limitless',
                'https://runescape.wiki/w/Sophanem_Slayer_Dungeon'
              ],
              confidence: 'confirmed_wiki',
              league_treatment: 'Treat 2,000 vital sparks and the Sophanem source as the base-game acquisition path; League drop multipliers belong in the League ruleset.'
            },
            {
              id: 'senntisten:greater-concentrated-blast',
              name: 'Greater Concentrated Blast',
              category: 'ability upgrade',
              region_hint: 'misthalin',
              region_status: 'historical_catalyst_working_taxonomy',
              unlocks: [{ name: 'Greater Concentrated Blast', source: 'Kerapac, the bound' }],
              source_urls: [
                'https://runescape.wiki/w/Greater_Concentrated_Blast',
                'https://runescape.wiki/w/Kerapac,_the_bound',
                'https://runescape.wiki/w/Catalyst_League/Tasks'
              ],
              confidence: 'current_wiki_unlock_working_league_region_taxonomy',
              league_treatment: 'Kerapac is in Senntisten. Misthalin is the current working League taxonomy, not an Equilibrium-specific locality reveal. Do not import old damage numbers from PvME.'
            },
            {
              id: 'senntisten:magma-tempest',
              name: 'Magma Tempest',
              category: 'ability unlock',
              region_hint: 'misthalin',
              region_status: 'historical_catalyst_working_taxonomy',
              unlocks: [
                { name: 'Magma Tempest', source: 'TzKal-Zuk' },
                { name: 'Magma Tempest (Targeted)', source: 'TzKal-Zuk' }
              ],
              source_urls: [
                'https://runescape.wiki/w/TzekHaar_Front',
                'https://runescape.wiki/w/TzKal-Zuk',
                'https://runescape.wiki/w/Catalyst_League/Tasks'
              ],
              confidence: 'current_wiki_unlock_working_league_region_taxonomy',
              league_treatment: 'The TzekHaar Front is in Senntisten. Keep Misthalin as a working League mapping only until Equilibrium publishes a finer locality rule.'
            },
            {
              id: 'zamorak-undercity:ability-codices',
              name: 'Zamorakian Undercity ability codices',
              category: 'ability upgrades',
              region_status: 'unresolved_cross_boundary',
              region_candidates: ['misthalin', 'forinthry'],
              unlocks: [
                { name: 'Chaos Roar', source: 'Chaos Roar ability codex' },
                { name: 'Greater Sunshine', source: 'Greater Sunshine ability codex', invention_requirement: 85, components: ['Codex of lost knowledge', 'Cywir components'] },
                { name: "Greater Death's Swiftness", source: "Greater Death's Swiftness ability codex", invention_requirement: 85, components: ['Codex of lost knowledge', 'Cywir components'] }
              ],
              source_urls: [
                'https://runescape.wiki/w/Codex',
                'https://runescape.wiki/w/Greater_Sunshine',
                'https://runescape.wiki/w/Greater_Death%27s_Swiftness_ability_codex_%28untradeable%29'
              ],
              confidence: 'confirmed_wiki_unlocks_region_unresolved',
              league_treatment: 'Do not hard-gate these to a region yet. The Undercity entrance and Zamorak encounter produce an explicit cross-boundary ambiguity already tracked by the planner.'
            },
            {
              id: 'telos:reprisal',
              name: 'Reprisal',
              category: 'ability unlock',
              region_hint: 'desert',
              region_status: 'current_repo_region_mapping',
              unlocks: [{ name: 'Reprisal', source: 'Reprisal ability codex' }],
              source_urls: [
                'https://runescape.wiki/w/Telos,_the_Warden',
                'https://runescape.wiki/w/Codex'
              ],
              confidence: 'confirmed_wiki_unlock_current_region_mapping',
              league_treatment: 'Use the existing Desert/Heart of Gielinor region mapping; do not copy Telos strategy or enrage data into the planner.'
            },
            {
              id: 'fort-forinthry:greater-sonic-wave',
              name: 'Greater Sonic Wave',
              category: 'ability upgrade',
              region_hint: 'misthalin',
              region_status: 'historical_catalyst_working_taxonomy',
              unlocks: [{ name: 'Greater Sonic Wave', source: 'Risen ghosts and armoured phantoms' }],
              source_urls: [
                'https://runescape.wiki/w/Greater_Sonic_Wave_ability_codex',
                'https://runescape.wiki/w/Fort_Forinthry_quest_series',
                'https://runescape.wiki/w/Catalyst_League/Tasks'
              ],
              confidence: 'confirmed_wiki_unlock_working_league_region_taxonomy',
              league_treatment: 'The monsters are accessed through the Fort Forinthry crypt. Keep the repo’s historical Misthalin working taxonomy visibly provisional because the crypt is north of the Fort in Wilderness geography.'
            },
            {
              id: 'fort-forinthry:invoke-lord-of-bones',
              name: 'Invoke Lord of Bones',
              category: 'incantation unlock',
              region_hint: 'misthalin',
              region_status: 'historical_catalyst_working_taxonomy',
              unlocks: [{ name: 'Invoke Lord of Bones', source: 'Zemouregal & Vorkath' }],
              source_urls: [
                'https://runescape.wiki/w/Zemouregal_%26_Vorkath',
                'https://runescape.wiki/w/Zemouregal_%26_Vorkath_loot_%28normal%29',
                'https://runescape.wiki/w/Catalyst_League/Tasks'
              ],
              confidence: 'confirmed_wiki_unlock_working_league_region_taxonomy',
              league_treatment: 'Use the current Fort Forinthry working taxonomy only as planner precedent until Equilibrium confirms the locality.'
            }
          ];

          for (const row of abilities) upsert(progression.ability_unlocks, row);

          const prayers = [
            {
              id: 'nex-aod:praesul-curses',
              name: 'Praesul codex curses',
              category: 'prayer unlocks',
              region_hint: 'asgarnia',
              region_status: 'confirmed_current_repo_region_mapping',
              prerequisite: 'Ancient Curses',
              unlocks: [
                { name: 'Malevolence', prayer_requirement: 99 },
                { name: 'Desolation', prayer_requirement: 99 },
                { name: 'Affliction', prayer_requirement: 99 },
                { name: 'Ruination', prayer_requirement: 99, necromancy_requirement: 95 }
              ],
              source_urls: [
                'https://runescape.wiki/w/Nex,_Angel_of_Death',
                'https://runescape.wiki/w/Unlockable_content',
                'https://runescape.wiki/w/Necromancy'
              ],
              confidence: 'confirmed_wiki',
              league_treatment: 'One Praesul codex unlocks one supported level-99 curse. Ancient Curses remain the base prayer-book prerequisite; apply League quest/passive overrides separately.'
            },
            {
              id: 'sanctum-of-rebirth:divine-rage',
              name: 'Divine Rage',
              category: 'prayer unlock',
              region_hint: 'misthalin',
              region_status: 'historical_city_of_um_working_taxonomy',
              unlocks: [{ name: 'Divine Rage', source: 'Divine Rage prayer codex' }],
              source_urls: [
                'https://runescape.wiki/w/Sanctum_of_Rebirth',
                'https://runescape.wiki/w/Divine_Rage_prayer_codex',
                'https://runescape.wiki/w/Catalyst_League/Tasks'
              ],
              confidence: 'confirmed_wiki_unlock_working_league_region_taxonomy',
              league_treatment: 'Sanctum access follows the City of Um working taxonomy already used by the planner; keep that locality provisional.'
            },
            {
              id: 'gate-of-elidinis:eclipsed-soul',
              name: 'Eclipsed Soul',
              category: 'prayer unlock',
              region_hint: 'misthalin',
              region_status: 'historical_city_of_um_working_taxonomy',
              unlocks: [{ name: 'Eclipsed Soul', source: 'Eclipsed Soul prayer codex' }],
              source_urls: [
                'https://runescape.wiki/w/The_Gate_of_Elidinis',
                'https://runescape.wiki/w/Eclipsed_Soul_prayer_codex',
                'https://runescape.wiki/w/Catalyst_League/Tasks'
              ],
              confidence: 'confirmed_wiki_unlock_working_league_region_taxonomy',
              league_treatment: 'Gate of Elidinis follows the City of Um working taxonomy already used by the planner; do not turn that precedent into an Equilibrium confirmation.'
            }
          ];

          for (const row of prayers) upsert(progression.prayer_unlocks, row);

          write(progressionPath, progression);

          // Keep the reference sync durable even if this job runs before the first salvage job.
          const syncPath = 'scripts/sync-reference-data.mjs';
          let sync = fs.readFileSync(syncPath, 'utf8');
          if (!sync.includes('const progressionUnlocks = read("scraped-data/progression-unlocks.json");')) {
            sync = sync.replace(
              'const rebalance = read("scraped-data/midgame-rebalance-2026-07-20.json");\nconst unknowns = read("scraped-data/unknowns.json");',
              'const rebalance = read("scraped-data/midgame-rebalance-2026-07-20.json");\nconst progressionUnlocks = read("scraped-data/progression-unlocks.json");\nconst referenceHarvest = read("scraped-data/reference-site-harvest.json");\nconst unknowns = read("scraped-data/unknowns.json");'
            );
            sync = sync.replace(
              'write("data/reference/midgame-rebalance-2026-07-20.json", rebalance);\nwrite("data/reference/unknowns.json", unknowns);',
              'write("data/reference/midgame-rebalance-2026-07-20.json", rebalance);\nwrite("data/reference/progression-unlocks.json", progressionUnlocks);\nwrite("data/research/reference-site-harvest.json", referenceHarvest);\nwrite("data/reference/unknowns.json", unknowns);'
            );
          }
          fs.writeFileSync(syncPath, sync);

          const pkgPath = 'package.json';
          const pkg = read(pkgPath);
          pkg.scripts['audit:references'] = 'node scripts/audit-reference-harvest.mjs';
          write(pkgPath, pkg);

          const indexPath = 'scraped-data/index.json';
          const index = read(indexPath);
          index.files ||= {};
          index.files['progression-unlocks.json'] = 'Current quest/account/equipment/ability/prayer unlock dependencies with explicit League override and region-boundary warnings';
          index.coverage ||= {};
          index.coverage.permanent_unlocks = 'quest and account gates plus current ability/prayer codex sources are serialized; cross-boundary or historical League locality mappings stay provisional';
          index.next_ingest_priority = (index.next_ingest_priority || []).filter((x) => x !== 'Expand permanent-unlock graph from verified Wiki rows without importing stale pre-modernisation values');
          const next = 'Continue permanent-unlock graph with current Wiki-only rows for remaining codices, enchantments, relics and task-set passives';
          if (!index.next_ingest_priority.includes(next)) index.next_ingest_priority.push(next);
          write(indexPath, index);

          const kimiPath = 'KIMI-START.md';
          let kimi = fs.readFileSync(kimiPath, 'utf8');
          const permanentLine = '- [ ] **Permanent unlock graph:** consume `data/reference/progression-unlocks.json` for base-game quest/account/equipment gates, then apply official Equilibrium auto-quest/relic overrides separately. `data/research/reference-site-harvest.json` is research/architecture context, not UI copy or a second source of game constants.\n';
          if (!kimi.includes('**Permanent unlock graph:**')) {
            const anchor = '- [ ] **Combat tables:**';
            const pos = kimi.indexOf(anchor);
            if (pos >= 0) {
              const end = kimi.indexOf('\n', pos);
              kimi = kimi.slice(0, end + 1) + permanentLine + kimi.slice(end + 1);
            }
          }
          fs.writeFileSync(kimiPath, kimi);
          NODE

      - name: Audit new unlock rows before normalization
        run: |
          node <<'NODE'
          const fs = require('fs');
          const doc = JSON.parse(fs.readFileSync('scraped-data/progression-unlocks.json', 'utf8'));
          const rows = [...(doc.ability_unlocks || []), ...(doc.prayer_unlocks || [])];
          const errors = [];
          const ids = new Set();
          const banned = ['unlock the power', 'game changer', 'seamlessly', 'robust solution', 'comprehensive solution', 'delve into', 'revolutionize', 'cutting edge', 'elevate your', 'supercharge your'];
          for (const row of rows) {
            if (!row.id || ids.has(row.id)) errors.push(`duplicate/missing id: ${row.id}`);
            ids.add(row.id);
            if (!Array.isArray(row.unlocks) || row.unlocks.length === 0) errors.push(`${row.id}: no unlocks`);
            if (!Array.isArray(row.source_urls) || row.source_urls.length === 0) errors.push(`${row.id}: no sources`);
            for (const url of row.source_urls || []) {
              try { new URL(url); } catch { errors.push(`${row.id}: bad url ${url}`); }
            }
            if (row.confidence === 'confirmed_wiki' && !(row.source_urls || []).some((url) => url.startsWith('https://runescape.wiki/'))) {
              errors.push(`${row.id}: confirmed_wiki without Wiki source`);
            }
            const prose = JSON.stringify(row).toLowerCase();
            for (const phrase of banned) if (prose.includes(phrase)) errors.push(`${row.id}: clanker phrase ${phrase}`);
          }
          if ((doc.quest_unlocks || []).some((row) => row.id === 'succession:dive')) errors.push('obsolete succession:dive survived');
          if (errors.length) {
            console.error(errors.join('\n'));
            process.exit(1);
          }
          console.log(`PERMANENT UNLOCK AUDIT OK — ${rows.length} sourced ability/prayer rows`);
          NODE

      - run: npm run normalize:data
      - run: npm run audit:references
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Commit validated expansion and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/expand-permanent-unlocks-once.yml
          git add KIMI-START.md package.json scripts/sync-reference-data.mjs scripts/audit-reference-harvest.mjs scraped-data/reference-site-harvest.json scraped-data/progression-unlocks.json scraped-data/index.json data/reference/progression-unlocks.json data/research/reference-site-harvest.json
          git commit -m "Expand verified permanent unlock graph"
          git pull --rebase origin main
          git push origin HEAD:main
