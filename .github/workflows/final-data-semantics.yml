name: Final data semantics pass

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-data-semantics.yml

permissions:
  contents: write

concurrency:
  group: final-data-semantics
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fix dungeon/boss semantics and Kimi handoff
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'scraped-data/regions.json';
          const doc = JSON.parse(fs.readFileSync(path, 'utf8'));
          const misthalin = doc.regions.find((r) => r.id === 'misthalin');
          if (!misthalin) throw new Error('Misthalin missing');

          const catalyst = 'https://runescape.wiki/w/Catalyst_League/Tasks';
          const sanctum = 'https://runescape.wiki/w/Sanctum_of_Rebirth';
          misthalin.bosses_and_combat = (misthalin.bosses_and_combat || []).filter((row) => row.name !== 'Sanctum of Rebirth');
          misthalin.notable_content ||= [];
          const dungeon = {
            name: 'Sanctum of Rebirth',
            type: 'boss dungeon',
            note: 'Three-boss dungeon reached through the City of Um side of the Underworld.',
            source_url: sanctum,
            region_evidence_url: catalyst,
            confidence: 'current_wiki_content_plus_historical_city_of_um_league_taxonomy'
          };
          const contentIndex = misthalin.notable_content.findIndex((row) => row.name === dungeon.name);
          if (contentIndex >= 0) misthalin.notable_content[contentIndex] = dungeon;
          else misthalin.notable_content.push(dungeon);

          const bosses = [
            ['Vermyx, Brood Mother', 'https://runescape.wiki/w/Vermyx,_Brood_Mother'],
            ['Kezalam, the Wanderer', 'https://runescape.wiki/w/Kezalam,_the_Wanderer'],
            ['Nakatra, Devourer Eternal', 'https://runescape.wiki/w/Nakatra,_Devourer_Eternal']
          ];
          for (const [name, source_url] of bosses) {
            const row = {
              name,
              group: 'Sanctum of Rebirth',
              source_url,
              region_evidence_url: catalyst,
              confidence: 'current_wiki_content_plus_historical_city_of_um_league_taxonomy'
            };
            const i = misthalin.bosses_and_combat.findIndex((entry) => entry.name === name);
            if (i >= 0) misthalin.bosses_and_combat[i] = row;
            else misthalin.bosses_and_combat.push(row);
          }
          fs.writeFileSync(path, JSON.stringify(doc, null, 2) + '\n');

          const kimiPath = 'KIMI-START.md';
          let kimi = fs.readFileSync(kimiPath, 'utf8');
          const old = '- [ ] **Region-value additions:** integrate new sourced rows for best combat/training spots, unique drops, Runecrafting altars/access, Invention unlocks/material loops, Archaeology dig sites/relic unlocks and other region-sensitive progression. Kimi wires the normalized records into existing region/skill views; Kimi does not research them.';
          const next = '- [ ] **Region-value additions:** `data/research/planner-expansions.json` now has sourced combat/training spots, unique drops, Runecrafting altars/access, Invention unlocks/material loops and Archaeology progression. Wire those records into the existing region/skill views; do not research replacements in this queue.';
          if (kimi.includes(old)) kimi = kimi.replace(old, next);
          fs.writeFileSync(kimiPath, kimi);
          NODE

      - run: npm ci
      - run: npm run normalize:data
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Commit and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/final-data-semantics.yml
          git add scraped-data/regions.json data/research/catalog.json KIMI-START.md
          git commit -m "Fix final region semantics and Kimi handoff"
          git pull --rebase origin main
          git push origin HEAD:main
