name: Fix PR20 salvage handoff once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-pr20-handoff-once.yml

permissions:
  contents: write

concurrency:
  group: fix-pr20-handoff-once
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Replace stale PR20 priority block
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('KIMI-START.md')
          s = p.read_text()
          start = s.find('### Highest current data priority')
          if start == -1:
              start = s.find('### Highest current')
          end = s.find('\n## 1. Design language', start) if start != -1 else -1
          if start == -1 or end == -1:
              raise SystemExit('stale PR20 priority block not found; refusing blind edit')
          replacement = '''### PR #20 salvage — complete\n\n- **Do not revisit PR #20 or `agent/invention-data-pass`.** The branch is already deleted and the PR is closed.\n- The handoff claim that `scraped-data/planner-expansions-archaeology-guild.json` was the last unique file was stale: that path never existed in PR #20.\n- SHA audit against PR #20 head `98fd65e2d9c135ea993661ed4d9dbe5377febcfb` confirmed every actual research overlay from that PR is already byte-for-byte on `main`: 4 Archaeology overlays, 6 Invention overlays and 3 Slayer overlays.\n- Treat the specialist Slayer/Invention/Archaeology feeds on `main` as canonical. Continue integration/research from current `main`; do not spend tokens attempting branch salvage.\n\n'''
          p.write_text(s[:start] + replacement + s[end+1:])
          PY
      - name: Commit correction and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-pr20-handoff-once.yml
          git add KIMI-START.md
          git commit -m "Mark PR20 salvage complete"
          git pull --rebase origin main
          git push origin HEAD:main
