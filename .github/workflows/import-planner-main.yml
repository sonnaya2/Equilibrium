# One-shot repair/import of the corrected planner-expansions source. Self-removes after validation.
name: Finish planner data import

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-planner-main.yml

permissions:
  contents: write

concurrency:
  group: finish-planner-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore corrected canonical planner source
        run: |
          git fetch origin agent/asset-harvest
          git checkout origin/agent/asset-harvest -- scraped-data/planner-expansions.json
      - run: npm ci
      - run: npm run normalize:data
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit validated planner source and generated mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/import-planner-main.yml
          git add scraped-data/planner-expansions.json data/research/planner-expansions.json data/research/catalog.json
          git commit -m "Complete sourced planner data import"
          git pull --rebase origin main
          git push origin HEAD:main
