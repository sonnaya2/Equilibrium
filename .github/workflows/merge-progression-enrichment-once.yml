name: Merge progression enrichment once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/merge-progression-enrichment-once.yml

permissions:
  contents: write

concurrency:
  group: merge-progression-enrichment-once
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prepare stable-ID enrichment scripts
        run: |
          git fetch origin agent/progression-harvest-synced
          git show origin/agent/progression-harvest-synced:scraped-data/progression-unlocks.json > /tmp/harvest-progression.json
          git show origin/agent/progression-harvest-synced:scraped-data/planner-expansions.json > /tmp/harvest-planner.json

          cat > /tmp/apply-progression-enrichment.mjs <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const read = (path) => JSON.parse(readFileSync(path, "utf8"));
          const write = (path, value) => writeFileSync(path, `${JSON.stringify(value, null, 2)}\n`);
          const find = (rows, id) => (rows || []).find((row) => row?.id === id);
          const addIfMissing = (target, source, id) => {
            if (find(target, id)) return;
            const row = find(source, id);
            if (!row) throw new Error(`validated harvest missing ${id}`);
            target.push(row);
          };

          const progressionPath = "scraped-data/progression-unlocks.json";
          const progression = read(progressionPath);
          const harvest = read("/tmp/harvest-progression.json");
          progression.account_unlocks ||= [];
          progression.activity_unlocks ||= [];
          progression.equipment_models ||= [];
          progression.consumable_unlocks ||= [];

          // Current main owns the activity audit for Mazcab, Shattered Worlds and Tuska's Wrath.
          // Never restore the older research IDs for those concepts.
          progression.activity_unlocks = progression.activity_unlocks.filter((row) => ![
            "mazcab:ability-codex-package",
            "shattered-worlds:utility-abilities",
          ].includes(row.id));

          const liveLivid = find(progression.activity_unlocks, "livid-farm:lunar-spells");
          const harvestedLivid = find(harvest.activity_unlocks, "livid-farm:lunar-spells");
          if (!liveLivid || !harvestedLivid) throw new Error("Livid Farm canonical/harvest row missing");
          for (const key of ["unlock_ladder", "point_semantics", "current_change", "source_urls"]) {
            if (liveLivid[key] == null && harvestedLivid[key] != null) liveLivid[key] = harvestedLivid[key];
          }
          if ((!liveLivid.confidence || liveLivid.confidence === "confirmed_wiki_unlocks_rate_not_used") && harvestedLivid.confidence) {
            liveLivid.confidence = harvestedLivid.confidence;
          }
          if (Array.isArray(liveLivid.source_urls) && liveLivid.source_url) delete liveLivid.source_url;

          addIfMissing(progression.activity_unlocks, harvest.activity_unlocks, "necromancy:well-of-souls-talents");

          for (const id of [
            "dungeoneering:spirit-cape-passive",
            "anachronia:slayer-lodge",
            "anachronia:player-lodge",
            "farms:combat-perk-state",
            "anachronia:totem-of-vitality",
            "legacy-of-zamorak:infernal-puzzle-box",
            "pvm:reaper-crew",
          ]) addIfMissing(progression.account_unlocks, harvest.account_unlocks, id);

          addIfMissing(progression.equipment_models, harvest.equipment_models, "zamorakian-slivers:enchantments");

          for (const row of harvest.consumable_unlocks || []) {
            if (!find(progression.consumable_unlocks, row.id)) progression.consumable_unlocks.push(row);
          }

          const upsertCurrent = (rows, row) => {
            const index = rows.findIndex((entry) => entry?.id === row.id);
            if (index >= 0) rows[index] = { ...rows[index], ...row };
            else rows.push(row);
          };

          // Flask/container infrastructure. Access and recipe ownership are separate planner edges.
          upsertCurrent(progression.consumable_unlocks, {
            id: "crafting:combat-flask-infrastructure",
            name: "Potion and crystal flask infrastructure",
            category: "six-dose combat container access",
            potion_flask: {
              crafting_level: 89,
              material: "Robust glass",
              material_access: ["As a First Resort", "81 Mining for red sandstone"],
              capacity_doses: 6,
            },
            crystal_flask: {
              crafting_level: 89,
              material: "Crystal glass",
              material_access: ["As a First Resort", "Plague's End", "81 Mining for crystal-flecked sandstone"],
              capacity_doses: 6,
              primary_use: "Combination potions",
            },
            source_urls: [
              "https://runescape.wiki/w/Crafting",
              "https://runescape.wiki/w/Potion_flask",
              "https://runescape.wiki/w/Crystal_flask",
            ],
            confidence: "confirmed_current_wiki",
            league_treatment: "Keep robust-glass and crystal-glass access separate. Six-dose container access is not implied by Herblore level alone.",
          });

          upsertCurrent(progression.consumable_unlocks, {
            id: "potion:holy-overload",
            name: "Holy overload potion",
            category: "permanent Meilyr combination-potion recipe",
            herblore_level: 97,
            recipe_shop_cost_coins: 700000,
            recipe_page_required: false,
            ingredients: ["Overload (4)", "Prayer renewal (4)", "Crystal flask"],
            output_doses: 6,
            source_urls: ["https://runescape.wiki/w/Holy_overload_potion"],
            confidence: "confirmed_current_wiki",
            league_treatment: "This direct Meilyr purchase is distinct from combination recipes that first require an unreadable Daemonheim recipe page.",
          });

          upsertCurrent(progression.consumable_unlocks, {
            id: "potion:spiritual-prayer",
            name: "Spiritual prayer potion",
            category: "permanent Meilyr combination-potion recipe",
            herblore_level: 110,
            recipe_shop_cost_coins: 1000000,
            ingredients: ["Prayer potion (4)", "Summoning potion (4)", "Primal extract", "Crystal flask"],
            output_doses: 6,
            effect_summary: "Combines prayer and summoning restoration and restores familiar special-move points per dose.",
            source_urls: ["https://runescape.wiki/w/Spiritual_prayer_potion"],
            confidence: "confirmed_current_wiki",
          });

          upsertCurrent(progression.consumable_unlocks, {
            id: "potion:extreme-prayer",
            name: "Extreme prayer potion",
            category: "high-level untradeable prayer consumable",
            herblore_level: 117,
            recipe_unlock: "automatic_by_level",
            ingredients: ["Primal extract", "Super prayer (3)", "Spark chitin"],
            source_urls: [
              "https://runescape.wiki/w/Extreme_prayer",
              "https://runescape.wiki/w/Calculator:Herblore/Extreme_potions",
            ],
            confidence: "confirmed_current_wiki",
            league_treatment: "This is the refill consumable for the blessed flask and a separate 117 Herblore gate from constructing the flask itself.",
          });

          upsertCurrent(progression.equipment_models, {
            id: "blessed-flask:prayer-storage",
            name: "Blessed flask",
            category: "refillable prayer-storage account item",
            herblore_level: 118,
            crafting_level: 96,
            capacity_doses: 80,
            refill: "Extreme prayer potion variants",
            final_components: [
              { item: "Blessed flask shell", quantity: 1 },
              { item: "Glorious silvthril chain", quantity: 1 },
              { item: "Holy elixir", quantity: 1 },
              { item: "Holy water", quantity: 1 },
              { item: "Light core", quantity: 5 },
              { item: "Holy overload potion (6)", quantity: 5 },
              { item: "Extreme prayer (4)", quantity: 5 },
              { item: "Positive energy", quantity: 500 },
            ],
            major_raw_dependencies: [
              { item: "Blessed sand", quantity: 40000 },
              { item: "Soda ash", quantity: 1200 },
              { item: "Red sandstone", quantity: 1200 },
              { item: "Crystal-flecked sandstone", quantity: 1200 },
              { item: "Harmonic dust", quantity: 5000 },
              { item: "Alaea sea salt", quantity: 250 },
            ],
            quest_dependencies: [
              "As a First Resort for sandstone glassmaking",
              "Plague's End for crystal-flecked sandstone / Prifddinas",
              "Legacy of Seergaze progression for the chain-link mould used in the silvthril-chain branch",
            ],
            source_urls: [
              "https://runescape.wiki/w/Blessed_flask",
              "https://runescape.wiki/w/Holy_overload_potion",
            ],
            confidence: "confirmed_current_wiki",
            league_treatment: "Model the flask as a dependency graph, not a single Crafting/Herblore checkbox. Do not store live GE cost estimates.",
          });

          progression.snapshot_date = [progression.snapshot_date, harvest.snapshot_date, "2026-07-24"].filter(Boolean).sort().at(-1);
          write(progressionPath, progression);

          // Archaeology already has current region/source rows on main. Fill only validated missing fields.
          const plannerPath = "scraped-data/planner-expansions.json";
          const planner = read(plannerPath);
          const harvestPlanner = read("/tmp/harvest-planner.json");
          const harvestRelics = new Map((harvestPlanner.archaeology_combat_relics || []).map((row) => [row.relic, row]));
          const liveRelics = planner.archaeology_combat_relics || [];
          for (const live of liveRelics) {
            const donor = harvestRelics.get(live.relic);
            if (!donor) continue;
            if (live.monolith_energy == null && donor.monolith_energy != null) live.monolith_energy = donor.monolith_energy;
            if (live.invention_level == null && donor.invention_level != null) live.invention_level = donor.invention_level;
            if ((!live.effect_summary || live.effect_summary === "PvM permanent unlock tracked by PvME") && donor.effect_summary) {
              live.effect_summary = donor.effect_summary;
            }
          }
          if (!liveRelics.some((row) => row.relic === "Blessing of Het")) {
            const donor = harvestRelics.get("Blessing of Het");
            if (!donor) throw new Error("validated Blessing of Het row missing");
            liveRelics.push(donor);
          }
          planner.archaeology_combat_relics = liveRelics;
          if (!planner.archaeology_relic_system && harvestPlanner.archaeology_relic_system) {
            planner.archaeology_relic_system = harvestPlanner.archaeology_relic_system;
          }
          write(plannerPath, planner);
          NODE

          cat > /tmp/audit-progression-enrichment.mjs <<'NODE'
          import { readFileSync } from "node:fs";
          const progression = JSON.parse(readFileSync("scraped-data/progression-unlocks.json", "utf8"));
          const planner = JSON.parse(readFileSync("scraped-data/planner-expansions.json", "utf8"));
          const fail = (message) => { throw new Error(`progression enrichment audit: ${message}`); };
          const byId = (rows, id) => (rows || []).find((row) => row?.id === id);

          const livid = byId(progression.activity_unlocks, "livid-farm:lunar-spells");
          const lividExpected = [10000, 20000, 35000, 45000, 60000, 75000, 90000, 100000, 110000, 120000, 130000];
          if (JSON.stringify((livid?.unlock_ladder || []).map((row) => row.produce_points)) !== JSON.stringify(lividExpected)) fail("Livid Farm thresholds drifted");

          const necro = byId(progression.activity_unlocks, "necromancy:well-of-souls-talents");
          if (necro?.talent_points?.maximum !== 21 || necro?.talent_points?.total_xp_for_all_21 !== 5740080) fail("Well of Souls talent-point state drifted");
          if (JSON.stringify((necro?.tiers || []).map((row) => row.souls)) !== JSON.stringify([1,50,400,2000,4500,8500,35000])) fail("Well of Souls soul thresholds drifted");

          for (const id of [
            "dungeoneering:spirit-cape-passive",
            "anachronia:slayer-lodge",
            "anachronia:player-lodge",
            "farms:combat-perk-state",
            "anachronia:totem-of-vitality",
            "legacy-of-zamorak:infernal-puzzle-box",
            "pvm:reaper-crew",
          ]) if (!byId(progression.account_unlocks, id)) fail(`missing account row ${id}`);

          const spirit = byId(progression.account_unlocks, "dungeoneering:spirit-cape-passive");
          if (spirit.token_cost !== 45000 || spirit.special_move_cost_reduction_percent !== 20) fail("Spirit cape drifted");
          const vitality = byId(progression.account_unlocks, "anachronia:totem-of-vitality");
          if (vitality.maximum_life_points_percent !== 25 || vitality.maximum_extra_life_points !== 1500) fail("Totem of Vitality drifted");
          const reaper = byId(progression.account_unlocks, "pvm:reaper-crew");
          if (reaper.bonuses?.prayer !== 2 || reaper.bonuses?.armour !== 20 || reaper.bonuses?.life_points !== 200) fail("Reaper Crew defensive bonuses drifted");
          for (const style of ["melee","ranged","magic","necromancy"]) if (reaper.bonuses?.damage?.[style] !== 12) fail(`Reaper Crew ${style} bonus drifted`);

          const enchant = byId(progression.equipment_models, "zamorakian-slivers:enchantments");
          if ((enchant?.records || []).length !== 9 || enchant?.region_status !== "unresolved_cross_boundary") fail("sliver enchantment model incomplete");
          const blessed = byId(progression.equipment_models, "blessed-flask:prayer-storage");
          if (blessed?.herblore_level !== 118 || blessed?.crafting_level !== 96 || blessed?.capacity_doses !== 80) fail("Blessed flask core requirements drifted");
          if (!blessed?.major_raw_dependencies?.some((row) => row.item === "Blessed sand" && row.quantity === 40000)) fail("Blessed flask sand dependency drifted");

          for (const id of [
            "herblore:overload-chain",
            "fort-forinthry:botanists-workbench",
            "potion:adrenaline-renewal",
            "bomb:vulnerability",
            "potion:weapon-poison-plus-plus-plus",
            "incense:kwuarm",
            "crafting:combat-flask-infrastructure",
            "potion:holy-overload",
            "potion:spiritual-prayer",
            "potion:extreme-prayer",
          ]) if (!byId(progression.consumable_unlocks, id)) fail(`missing consumable progression ${id}`);

          const flask = byId(progression.consumable_unlocks, "crafting:combat-flask-infrastructure");
          if (flask?.potion_flask?.crafting_level !== 89 || flask?.crystal_flask?.crafting_level !== 89) fail("flask Crafting requirements drifted");
          const holy = byId(progression.consumable_unlocks, "potion:holy-overload");
          if (holy?.herblore_level !== 97 || holy?.recipe_shop_cost_coins !== 700000 || holy?.recipe_page_required !== false) fail("Holy overload recipe drifted");
          const spiritual = byId(progression.consumable_unlocks, "potion:spiritual-prayer");
          if (spiritual?.herblore_level !== 110 || spiritual?.recipe_shop_cost_coins !== 1000000) fail("Spiritual prayer recipe drifted");
          if (byId(progression.activity_unlocks, "mazcab:ability-codex-package")) fail("superseded Mazcab duplicate survived");
          if (byId(progression.activity_unlocks, "shattered-worlds:utility-abilities")) fail("superseded Shattered Worlds duplicate survived");

          const relics = new Map((planner.archaeology_combat_relics || []).map((row) => [row.relic, row]));
          for (const [name, level, energy] of [
            ["Font of Life",5,50],
            ["Berserker's Fury",56,250],
            ["Blessing of Het",74,100],
            ["Death Ward",81,150],
            ["Fury of the Small",97,150],
            ["Heightened Senses",105,350],
            ["Conservation of Energy",118,350],
          ]) {
            const row = relics.get(name);
            if (!row || row.archaeology_level !== level || row.monolith_energy !== energy) fail(`${name} relic metadata drifted`);
          }
          if (planner.archaeology_relic_system?.active_relic_limit !== 3) fail("Archaeology relic slot limit drifted");
          if (JSON.stringify(planner.archaeology_relic_system?.monolith_energy_caps) !== JSON.stringify([150,250,400,500,650])) fail("monolith energy caps drifted");

          const banned = ["unlock the power","game changer","seamlessly","robust solution","comprehensive solution","delve into","revolutionize","cutting edge","elevate your","supercharge your"];
          const prose = JSON.stringify({ progression, planner }).toLowerCase();
          for (const phrase of banned) if (prose.includes(phrase)) fail(`clanker phrase: ${phrase}`);
          console.log("Progression enrichment audit passed");
          NODE

      - name: Merge, normalize and validate against current main
        run: |
          validate() {
            node /tmp/apply-progression-enrichment.mjs
            cp /tmp/audit-progression-enrichment.mjs scripts/audit-progression-enrichment.mjs
            npm run normalize:data
            npm run audit:progression
            node scripts/audit-progression-enrichment.mjs
            npm run audit:references
            npm run audit:boundaries
            npm run typecheck
            npm test
            npm run build
          }

          validate

          # Kimi/data agents may move main while the full suite runs. If that happened,
          # rebase by reconstruction instead of resolving generated JSON conflicts.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git reset --hard origin/main
            validate
          fi

      - name: Commit only after latest-main validation
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main advanced after validation; refusing stale write"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/merge-progression-enrichment-once.yml
          git add scraped-data/progression-unlocks.json scraped-data/planner-expansions.json scripts/audit-progression-enrichment.mjs data/reference/progression-unlocks.json data/research/planner-expansions.json data/research/catalog.json
          git commit -m "Merge verified progression and consumable enrichment"
          git push origin HEAD:main
