name: Normalize data

# Research pipeline only. Release tree ships data/ without scraped-data/.
# Run manually when you have a local scraped-data/ research checkout.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: normalize-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Require scraped-data research inputs
        shell: bash
        run: |
          if [ ! -d scraped-data ] || [ ! -f scraped-data/index.json ]; then
            echo "scraped-data/ is not in the release tree."
            echo "Clone or restore research inputs locally, then re-run this workflow,"
            echo "or edit data/ directly (app runtime only reads data/)."
            exit 1
          fi

      - run: npm run normalize:data
      - name: Audit all canonical and research data
        run: npm run audit:all-data

      - name: Commit generated data
        shell: bash
        run: |
          if git diff --quiet -- data/ public/data/; then
            echo "data/ is already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ public/data/
          git commit -m "Sync normalized data"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
