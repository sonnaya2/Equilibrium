name: Recover permanent unlock rows once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-permanent-unlocks-once.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore audited ability and prayer dependencies
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'scraped-data/progression-unlocks.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const upsert = (rows, row) => {
            const index = rows.findIndex((item) => item.id === row.id);
            if (index >= 0) rows[index] = row;
            else rows.push(row);
          };
          data.ability_unlocks ||= [];
          data.prayer_unlocks ||= [];

          const abilities = [
            {
              id: 'dragonkin-laboratory:greater-melee-codices',
              name: 'Dragonkin Laboratory greater melee codices',
              category: 'ability upgrades',
              region_hint: 'forinthry',
              region_status: 'confirmed_base_game_geography',
              unlocks: [
                { name: 'Greater Flurry', source: 'Astellarn' },
                { name: 'Greater Fury', source: 'Verak Lith' },
                { name: 'Greater Barge', source: 'Black Stone Dragon' }
              ],
              source_urls: ['https://runescape.wiki/w/Dragonkin_Laboratory', 'https://runescape.wiki/w/Codex'],
              confidence: 'confirmed_wiki',
              league_treatment: 'The dungeon is in the Wilderness. Use Forinthry for base geography, then apply any explicit Equilibrium access exception separately.'
            },
            {
              id: 'sophanem:limitless',
              name: 'Limitless',
              category: 'ability unlock',
              region_hint: 'desert',
              region_status: 'confirmed_base_game_geography',
              unlocks: [{ name: 'Limitless', source: 'Limitless ability codex' }],
              materials: [{ name: 'Vital spark', quantity: 2000 }],
              source_urls: ['https://runescape.wiki/w/Limitless', 'https://runescape.wiki/w/Sophanem_Slayer_Dungeon'],
              confidence: 'confirmed_wiki',
              league_treatment: 'Treat 2,000 vital sparks and the Sophanem source as the base-game acquisition path; League drop multipliers belong in the League ruleset.'
            },
            {
              id: 'senntisten:greater-concentrated-blast',
              name: 'Greater Concentrated Blast',
              category: 'ability upgrade',
              region_hint: 'misthalin',
              region_status: 'historical_catalyst_working_taxonomy',
              unlocks: [{ name: 'Greater Concentrated Blast', source: 'Kerapac, the bound' }],
              source_urls: ['https://runescape.wiki/w/Greater_Concentrated_Blast', 'https://runescape.wiki/w/Kerapac,_the_bound', 'https://runescape.wiki/w/Catalyst_League/Tasks'],
              confidence: 'current_wiki_unlock_working_league_region_taxonomy',
              league_treatment: 'Kerapac is in Senntisten. Misthalin is the current working League taxonomy, not an Equilibrium-specific locality reveal. Do not import old damage numbers from PvME.'
            },
            {
              id: 'senntisten:magma-tempest',
              name: 'Magma Tempest',
              category: 'ability unlock',
              region_hint: 'misthalin',
              region_status: 'historical_catalyst_working_taxonomy',
              unlocks: [{ name: 'Magma Tempest', source: 'TzKal-Zuk' }, { name: 'Magma Tempest (Targeted)', source: 'TzKal-Zuk' }],
              source_urls: ['https://runescape.wiki/w/TzekHaar_Front', 'https://runescape.wiki/w/TzKal-Zuk', 'https://runescape.wiki/w/Catalyst_League/Tasks'],
              confidence: 'current_wiki_unlock_working_league_region_taxonomy',
              league_treatment: 'The TzekHaar Front is in Senntisten. Keep Misthalin as a working League mapping only until Equilibrium publishes a finer locality rule.'
            },
            {
              id: 'zamorak-undercity:ability-codices',
              name: 'Zamorakian Undercity ability codices',
              category: 'ability upgrades',
              region_status: 'unresolved_cross_boundary',
              region_candidates: ['misthalin', 'forinthry'],
              unlocks: [
                { name: 'Chaos Roar', source: 'Chaos Roar ability codex' },
                { name: 'Greater Sunshine', source: 'Greater Sunshine ability codex', invention_requirement: 85, components: ['Codex of lost knowledge', 'Cywir components'] },
                { name: "Greater Death's Swiftness", source: "Greater Death's Swiftness ability codex", invention_requirement: 85, components: ['Codex of lost knowledge', 'Cywir components'] }
              ],
              source_urls: ['https://runescape.wiki/w/Codex', 'https://runescape.wiki/w/Greater_Sunshine', 'https://runescape.wiki/w/Greater_Death%27s_Swiftness_ability_codex_%28untradeable%29'],
              confidence: 'confirmed_wiki_unlocks_region_unresolved',
              league_treatment: 'Do not hard-gate these to a region yet. The Undercity entrance and Zamorak encounter produce an explicit cross-boundary ambiguity already tracked by the planner.'
            },
            {
              id: 'telos:reprisal',
              name: 'Reprisal',
              category: 'ability unlock',
              region_hint: 'desert',
              region_status: 'current_repo_region_mapping',
              unlocks: [{ name: 'Reprisal', source: 'Reprisal ability codex' }],
              source_urls: ['https://runescape.wiki/w/Telos,_the_Warden', 'https://runescape.wiki/w/Codex'],
              confidence: 'confirmed_wiki_unlock_current_region_mapping',
              league_treatment: 'Use the existing Desert/Heart of Gielinor region mapping; do not copy Telos strategy or enrage data into the planner.'
            },
            {
              id: 'fort-forinthry:greater-sonic-wave',
              name: 'Greater Sonic Wave',
              category: 'ability upgrade',
              region_hint: 'misthalin',
              region_status: 'historical_catalyst_working_taxonomy',
              unlocks: [{ name: 'Greater Sonic Wave', source: 'Risen ghosts and armoured phantoms' }],
              source_urls: ['https://runescape.wiki/w/Greater_Sonic_Wave_ability_codex', 'https://runescape.wiki/w/Fort_Forinthry_quest_series', 'https://runescape.wiki/w/Catalyst_League/Tasks'],
              confidence: 'confirmed_wiki_unlock_working_league_region_taxonomy',
              league_treatment: 'The monsters are accessed through the Fort Forinthry crypt. Keep the historical Misthalin working taxonomy visibly provisional because the crypt is north of the Fort in Wilderness geography.'
            },
            {
              id: 'fort-forinthry:invoke-lord-of-bones',
              name: 'Invoke Lord of Bones',
              category: 'incantation unlock',
              region_hint: 'misthalin',
              region_status: 'historical_catalyst_working_taxonomy',
              unlocks: [{ name: 'Invoke Lord of Bones', source: 'Zemouregal & Vorkath' }],
              source_urls: ['https://runescape.wiki/w/Zemouregal_%26_Vorkath', 'https://runescape.wiki/w/Zemouregal_%26_Vorkath_loot_%28normal%29', 'https://runescape.wiki/w/Catalyst_League/Tasks'],
              confidence: 'confirmed_wiki_unlock_working_league_region_taxonomy',
              league_treatment: 'Use the current Fort Forinthry working taxonomy only as planner precedent until Equilibrium confirms the locality.'
            }
          ];

          const prayers = [
            {
              id: 'nex-aod:praesul-curses',
              name: 'Praesul codex curses',
              category: 'prayer unlocks',
              region_hint: 'asgarnia',
              region_status: 'confirmed_current_repo_region_mapping',
              prerequisite: 'Ancient Curses',
              unlocks: [
                { name: 'Malevolence', prayer_requirement: 99 },
                { name: 'Desolation', prayer_requirement: 99 },
                { name: 'Affliction', prayer_requirement: 99 },
                { name: 'Ruination', prayer_requirement: 99, necromancy_requirement: 95 }
              ],
              source_urls: ['https://runescape.wiki/w/Nex,_Angel_of_Death', 'https://runescape.wiki/w/Unlockable_content', 'https://runescape.wiki/w/Necromancy'],
              confidence: 'confirmed_wiki',
              league_treatment: 'One Praesul codex unlocks one supported level-99 curse. Ancient Curses remain the base prayer-book prerequisite; apply League quest/passive overrides separately.'
            },
            {
              id: 'sanctum-of-rebirth:divine-rage',
              name: 'Divine Rage',
              category: 'prayer unlock',
              region_hint: 'misthalin',
              region_status: 'historical_city_of_um_working_taxonomy',
              unlocks: [{ name: 'Divine Rage', source: 'Divine Rage prayer codex' }],
              source_urls: ['https://runescape.wiki/w/Sanctum_of_Rebirth', 'https://runescape.wiki/w/Divine_Rage_prayer_codex', 'https://runescape.wiki/w/Catalyst_League/Tasks'],
              confidence: 'confirmed_wiki_unlock_working_league_region_taxonomy',
              league_treatment: 'Sanctum access follows the City of Um working taxonomy already used by the planner; keep that locality provisional.'
            },
            {
              id: 'gate-of-elidinis:eclipsed-soul',
              name: 'Eclipsed Soul',
              category: 'prayer unlock',
              region_hint: 'misthalin',
              region_status: 'historical_city_of_um_working_taxonomy',
              unlocks: [{ name: 'Eclipsed Soul', source: 'Eclipsed Soul prayer codex' }],
              source_urls: ['https://runescape.wiki/w/The_Gate_of_Elidinis', 'https://runescape.wiki/w/Eclipsed_Soul_prayer_codex', 'https://runescape.wiki/w/Catalyst_League/Tasks'],
              confidence: 'confirmed_wiki_unlock_working_league_region_taxonomy',
              league_treatment: 'Gate of Elidinis follows the City of Um working taxonomy already used by the planner; do not turn that precedent into an Equilibrium confirmation.'
            }
          ];

          for (const row of abilities) upsert(data.ability_unlocks, row);
          for (const row of prayers) upsert(data.prayer_unlocks, row);
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          NODE
      - run: npm run normalize:data
      - run: npm run audit:progression
      - run: npm run audit:references
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit recovered canonical data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/recover-permanent-unlocks-once.yml
          git add scraped-data/progression-unlocks.json data/reference/progression-unlocks.json
          git commit -m "Restore audited ability and prayer unlocks"
          git pull --rebase origin main
          git push origin HEAD:main
