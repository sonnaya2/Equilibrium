# One-shot salvage of unique reference-site research from agent/reference-site-harvest.
# Self-removes after normalization, audit, typecheck, tests and build pass.
name: Salvage reference harvest once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/salvage-reference-harvest-once.yml

permissions:
  contents: write

concurrency:
  group: salvage-reference-harvest-once
  cancel-in-progress: false

jobs:
  salvage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Recover unique research blobs and validator
        run: |
          git fetch origin agent/reference-site-harvest
          git show origin/agent/reference-site-harvest:data/research/reference-site-harvest.json > scraped-data/reference-site-harvest.json
          git show origin/agent/reference-site-harvest:scraped-data/progression-unlocks.json > scraped-data/progression-unlocks.json
          git show origin/agent/reference-site-harvest:scripts/audit-reference-harvest.mjs > scripts/audit-reference-harvest.mjs
      - name: Correct stale Dive dependency and wire canonical sync
        run: |
          node <<'NODE'
          const fs = require('fs');
          const read = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p, v) => fs.writeFileSync(p, JSON.stringify(v, null, 2) + '\n');

          const progressionPath = 'scraped-data/progression-unlocks.json';
          const progression = read(progressionPath);
          progression.quest_unlocks = (progression.quest_unlocks || []).filter((row) => row.id !== 'succession:dive');
          progression.account_unlocks ||= [];
          const dive = {
            id: 'agility:dive',
            name: 'Dive',
            category: 'movement ability',
            access_requirements: ['30 Agility'],
            historical_requirement: 'Previously unlocked through Succession before the 20 July 2026 Mid-Game Rebalance.',
            source_url: 'https://secure.runescape.com/m=news/patch-notes-mid-game-rebalance',
            confidence: 'confirmed_official',
            league_treatment: 'Base-game level gate. Apply any explicit Equilibrium relic/passive override separately rather than restoring the obsolete Succession quest dependency.'
          };
          const diveIndex = progression.account_unlocks.findIndex((row) => row.id === dive.id);
          if (diveIndex >= 0) progression.account_unlocks[diveIndex] = dive;
          else progression.account_unlocks.push(dive);
          write(progressionPath, progression);

          const syncPath = 'scripts/sync-reference-data.mjs';
          let sync = fs.readFileSync(syncPath, 'utf8');
          if (!sync.includes('const progressionUnlocks = read("scraped-data/progression-unlocks.json");')) {
            sync = sync.replace(
              'const rebalance = read("scraped-data/midgame-rebalance-2026-07-20.json");\nconst unknowns = read("scraped-data/unknowns.json");',
              'const rebalance = read("scraped-data/midgame-rebalance-2026-07-20.json");\nconst progressionUnlocks = read("scraped-data/progression-unlocks.json");\nconst referenceHarvest = read("scraped-data/reference-site-harvest.json");\nconst unknowns = read("scraped-data/unknowns.json");'
            );
            sync = sync.replace(
              'write("data/reference/midgame-rebalance-2026-07-20.json", rebalance);\nwrite("data/reference/unknowns.json", unknowns);',
              'write("data/reference/midgame-rebalance-2026-07-20.json", rebalance);\nwrite("data/reference/progression-unlocks.json", progressionUnlocks);\nwrite("data/research/reference-site-harvest.json", referenceHarvest);\nwrite("data/reference/unknowns.json", unknowns);'
            );
            sync = sync.replace(
              'Combat, Catalyst, 2026 changes, mid-game rebalance and unknowns updated.',
              'Combat, Catalyst, 2026 changes, mid-game rebalance, permanent unlocks, reference harvest and unknowns updated.'
            );
          }
          fs.writeFileSync(syncPath, sync);

          const packagePath = 'package.json';
          const pkg = read(packagePath);
          pkg.scripts['audit:references'] = 'node scripts/audit-reference-harvest.mjs';
          write(packagePath, pkg);

          const indexPath = 'scraped-data/index.json';
          const index = read(indexPath);
          index.files['reference-site-harvest.json'] = 'Deduplicated RS Analysis + PvME crawl notes, source guardrails and mechanic/dependency discoveries; boss-guide prose/rotations excluded';
          index.files['progression-unlocks.json'] = 'Current permanent quest/account/equipment unlock dependencies with League-override warnings';
          index.coverage.permanent_unlocks = 'quest-gated spellbooks/abilities, War’s Retreat milestones, EoF special storage and the current Dive level gate are serialized separately from League overrides';
          const priorities = index.next_ingest_priority || [];
          const remaining = 'Expand permanent-unlock graph from verified Wiki rows without importing stale pre-modernisation values';
          if (!priorities.includes(remaining)) priorities.push(remaining);
          index.next_ingest_priority = priorities;
          write(indexPath, index);

          const kimiPath = 'KIMI-START.md';
          let kimi = fs.readFileSync(kimiPath, 'utf8');
          const anchor = '- [ ] **Combat tables:** when the data pass adds/updates current ability, cooldown, adrenaline, hit-range, weapon override, special-attack, prayer/potion/perk or 2026-hotfix records under `data/combat/`, wire the typed combat accessors/engine to them. Do not re-scrape PvME, RS Analysis, the Wiki or Jagex from this queue.\n';
          const addition = '- [ ] **Permanent unlock graph:** consume `data/reference/progression-unlocks.json` for base-game quest/account/equipment gates, then apply official Equilibrium auto-quest/relic overrides separately. `data/research/reference-site-harvest.json` is research/architecture context, not UI copy or a second source of game constants.\n';
          if (kimi.includes(anchor) && !kimi.includes('**Permanent unlock graph:**')) kimi = kimi.replace(anchor, anchor + addition);
          fs.writeFileSync(kimiPath, kimi);
          NODE
      - run: npm ci
      - run: npm run normalize:data
      - run: npm run audit:references
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit validated salvage and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/salvage-reference-harvest-once.yml
          git add KIMI-START.md package.json scripts/sync-reference-data.mjs scripts/audit-reference-harvest.mjs scraped-data/reference-site-harvest.json scraped-data/progression-unlocks.json scraped-data/index.json data/research/reference-site-harvest.json data/reference/progression-unlocks.json
          git commit -m "Salvage verified reference-site research"
          git pull --rebase origin main
          git push origin HEAD:main
