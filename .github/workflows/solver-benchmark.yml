# Quick solver unit micro-benchmark / regression slice.
# Manual dispatch + weekly schedule. Not on every push.
name: Solver benchmark (quick)

on:
  workflow_dispatch:
  schedule:
    # Mondays 06:17 UTC (offset from top-of-hour stampede)
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: solver-benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  solver-quick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Solver quick benchmark
        run: npm run benchmark:solver:quick
