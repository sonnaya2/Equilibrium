name: Sync sourced RuneScape assets

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: equilibrium-generated-data-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Refresh branch before harvest
        run: git pull --rebase origin main

      - name: Normalize region names
        run: node scripts/normalize-region-names.mjs

      - name: Harvest assets
        run: node scripts/sync-assets.mjs

      - name: Publish attributed assets
        run: node scripts/publish-assets.mjs

      - name: Show harvest result
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'assets/manifest.generated.json';
          if (!fs.existsSync(p)) process.exit(0);
          const m = JSON.parse(fs.readFileSync(p, 'utf8'));
          console.log(`Resolved ${m.count} assets (${m.totalBytes} bytes); unresolved ${m.unresolvedCount}`);
          for (const x of m.unresolved || []) console.log(`UNRESOLVED ${x.id}: ${x.error}`);
          NODE

      - name: Commit normalized data and harvested assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets public data src app
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Sync sourced RuneScape assets"
          git pull --rebase origin main
          git push origin HEAD:main
