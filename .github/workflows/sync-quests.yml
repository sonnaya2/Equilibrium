name: Sync Equilibrium quest data

on:
  workflow_dispatch:
  schedule:
    - cron: "23 15 * * *"
  push:
    branches:
      - main
    paths:
      - data/league/quest-region-rules.json
      - data/league/equilibrium-auto-quests.json
      - scripts/sync-quest-regions.mjs
      - scripts/sync-equilibrium-auto-quests.mjs
      - scripts/export-quest-region-review.mjs
      - scripts/lib/runescape-wiki.mjs

permissions:
  contents: write

concurrency:
  group: equilibrium-generated-data-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build complete current quest catalog
        run: node scripts/sync-quest-regions.mjs

      - name: Export boundary review queue
        run: node scripts/export-quest-region-review.mjs

      - name: Apply official Jagex auto-completion lists when published
        run: node scripts/sync-equilibrium-auto-quests.mjs

      - name: Quest data summary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const q = JSON.parse(fs.readFileSync('data/league/quests.json', 'utf8'));
          const r = JSON.parse(fs.readFileSync('data/league/quest-region-review.json', 'utf8'));
          console.log(`Quest-list entries: ${q.quest_list_entry_count ?? q.quest_count}`);
          console.log(`Numbered quests: ${q.wiki_numbered_quest_count ?? '?'}`);
          console.log(`Primary boundary review: ${r.count}`);
          console.log(`Cross-region: ${q.quests.filter(x => x.cross_region).length}`);
          NODE

      - name: Commit generated quest data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/league/quests.json data/league/equilibrium-auto-quests.json data/league/quest-region-review.json
          if git diff --cached --quiet; then
            echo "No quest data changes"
            exit 0
          fi
          git commit -m "Sync Equilibrium quest data"
          git pull --rebase origin main
          git push origin HEAD:main
