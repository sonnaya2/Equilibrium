# One-shot audit validator. Remove after AUDIT_RECONCILE_STATUS.txt lands on the target branch.
name: Validate audit reconciliation once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-audit-reconcile-once.yml

permissions:
  contents: write

concurrency:
  group: validate-audit-reconcile-once
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-reconcile-current-main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: ci
        continue-on-error: true
        run: npm ci
      - id: normalize
        continue-on-error: true
        run: npm run normalize:data
      - id: typecheck
        continue-on-error: true
        run: npm run typecheck
      - id: test
        continue-on-error: true
        run: npm test
      - id: build
        continue-on-error: true
        run: npm run build
      - id: browser
        continue-on-error: true
        run: npx playwright install --with-deps chromium
      - id: e2e
        continue-on-error: true
        run: npm run test:e2e
      - name: Record results on audit branch
        if: always()
        env:
          CI_OUTCOME: ${{ steps.ci.outcome }}
          NORMALIZE_OUTCOME: ${{ steps.normalize.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          printf 'validated_branch_head=%s\nnpm_ci=%s\nnormalize=%s\ntypecheck=%s\ntests=%s\nbuild=%s\nbrowser=%s\ne2e=%s\n' \
            "$(git rev-parse HEAD)" "$CI_OUTCOME" "$NORMALIZE_OUTCOME" "$TYPECHECK_OUTCOME" "$TEST_OUTCOME" "$BUILD_OUTCOME" "$BROWSER_OUTCOME" "$E2E_OUTCOME" > AUDIT_RECONCILE_STATUS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AUDIT_RECONCILE_STATUS.txt
          git commit -m "Record reconciled audit validation status"
          git push origin HEAD:audit-reconcile-current-main
      - name: Fail if validation failed
        if: always()
        env:
          CI_OUTCOME: ${{ steps.ci.outcome }}
          NORMALIZE_OUTCOME: ${{ steps.normalize.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          test "$CI_OUTCOME" = success
          test "$NORMALIZE_OUTCOME" = success
          test "$TYPECHECK_OUTCOME" = success
          test "$TEST_OUTCOME" = success
          test "$BUILD_OUTCOME" = success
          test "$BROWSER_OUTCOME" = success
          test "$E2E_OUTCOME" = success
