name: Validate canonical data

on:
  pull_request:
    branches:
      - main
    paths:
      - "data/**"
      - "scraped-data/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-data-only.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run normalize:data
      - name: Run complete data audit
        id: data-audit
        shell: bash
        run: |
          set +e
          npm run audit:all-data > data-audit.log 2>&1
          status=$?
          tail -n 120 data-audit.log
          exit "$status"
      - name: Upload data-audit failure log
        if: failure() && steps.data-audit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: data-audit-failure
          path: data-audit.log
          if-no-files-found: error
          retention-days: 3
      - name: Ensure generated data is committed
        run: git diff --exit-code -- data/
