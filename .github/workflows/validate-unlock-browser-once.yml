name: Validate unlock browser once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-unlock-browser-once.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run normalize:data
      - run: npm run audit:progression
      - run: npm run audit:references
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Remove successful one-shot gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-unlock-browser-once.yml
          git commit -m "Validate permanent unlock browser"
          git pull --rebase origin main
          git push origin HEAD:main
