name: Validate app

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "data/**"
      - "scraped-data/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "data/**"
      - "scraped-data/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Normalize research data in the validation workspace
        run: npm run normalize:data
      - name: Audit permanent unlock assumptions
        run: npm run audit:progression
      - name: Audit progression enrichment
        run: npm run audit:enrichment
      - name: Audit reference research corpus
        run: npm run audit:references
      - name: Audit Masterwork staff region chain
        run: npm run audit:masterwork
      - name: Audit League region boundaries
        run: npm run audit:boundaries
      - name: Audit Slayer, Invention and Archaeology supplements
        run: npm run audit:supplements
      - run: npm run typecheck
      - name: Run unit tests
        id: unit-tests
        shell: bash
        run: |
          set +e
          npm test > vitest.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 120 vitest.log
            exit "$status"
          fi
          cat vitest.log
      - name: Upload unit-test failure log
        if: failure() && steps.unit-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-failure
          path: vitest.log
          if-no-files-found: error
          retention-days: 3
      - run: npm run build
