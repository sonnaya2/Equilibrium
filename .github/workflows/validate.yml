# App validate: normalize, audit, typecheck, unit tests, build.
# Full Playwright (incl. map) stays local (npm run test:e2e). Combat-only E2E
# can run via npm run test:e2e:combat — enable the optional job only after local
# stability; map/WebGPU suite remains out of CI.
name: Validate app

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "data/**"
      - "public/data/**"
      - "scripts/**"
      - "e2e/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate.yml"
  workflow_dispatch:
    inputs:
      enable_combat_e2e:
        description: "Run combat-only Playwright after validate (no map/WebGPU)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Rebuild the generated database and exports from data/canonical/, the
      # migrations, and the patches. The retired seed is not an input here.
      - name: Audit data platform
        run: npm run audit:data
      # Fails if the icon index drifts from public/game, a reward alias points at
      # nothing, two rows claim one path, or art is duplicated without an alsoAt.
      - name: Audit art
        run: npm run art:check
      - run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Run unit tests
        id: unit-tests
        shell: bash
        run: |
          set +e
          npm test > vitest.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 120 vitest.log
            exit "$status"
          fi
          cat vitest.log
      - name: Upload unit-test failure log
        if: failure() && steps.unit-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-failure
          path: vitest.log
          if-no-files-found: error
          retention-days: 3
      - run: npm run build

  # Combat-only Playwright: no map/WebGPU. Disabled by default until the job
  # has been green locally under CI=1 repeatedly; set enable_combat_e2e input
  # or uncomment the job gate after measured stability.
  combat-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_combat_e2e == true }}
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Combat E2E
        id: combat-e2e
        env:
          CI: "1"
          PLAYWRIGHT_WORKERS: "1"
        run: npm run test:e2e:combat
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: combat-e2e-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 5
