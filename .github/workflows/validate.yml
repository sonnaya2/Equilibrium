# App validate: normalize, audit, typecheck, unit tests, build.
# Playwright e2e is intentionally local-only (npm run test:e2e on port 3100).
# Do not add a CI e2e job here without solving headless WebGPU / map flake risk.
name: Validate app

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "data/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "data/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # data/ is the shipped store. audit:data is the CI gate (schema / IDs / sources).
      # normalize:data needs a local scraped-data/ checkout (gitignored) and is
      # manual-only — see normalize-data.yml. Before large research PRs, run
      # normalize + git diff -- data/ locally so generated files stay committed.
      - name: Audit shipped data/
        run: npm run audit:data
      - run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Run unit tests
        id: unit-tests
        shell: bash
        run: |
          set +e
          npm test > vitest.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 120 vitest.log
            exit "$status"
          fi
          cat vitest.log
      - name: Upload unit-test failure log
        if: failure() && steps.unit-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-failure
          path: vitest.log
          if-no-files-found: error
          retention-days: 3
      - run: npm run build
