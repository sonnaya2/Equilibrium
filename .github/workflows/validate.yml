name: Validate app

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "data/**"
      - "scraped-data/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "data/**"
      - "scraped-data/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Normalize research data in the validation workspace
        run: npm run normalize:data
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
