# App validate: install, data/art/architecture audit, typecheck, lint, format,
# unit tests, build.
#
# Full Playwright (incl. map/WebGPU) stays local (npm run test:e2e).
# Combat-only E2E is NOT on every push — use workflow combat-e2e.yml (dispatch)
# or this workflow's workflow_dispatch input enable_combat_e2e. Never enable
# map/WebGPU in this workflow.
#
# Smoke vs full combat:
#   e2e/smoke.spec.ts  — route/nav smoke (default Playwright suite / local)
#   e2e/combat.spec.ts — full combat UI E2E; dispatch-only under CI
name: Validate app

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "data/**"
      - "public/**"
      - "asset-catalog/**"
      - "scripts/**"
      - "e2e/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig*.json"
      - "next.config.ts"
      - "eslint.config.mjs"
      - "vitest.config.ts"
      - "playwright.config.ts"
      - "playwright.combat.config.ts"
      - "playwright.reuse.config.ts"
      - "playwright.webgpu.config.ts"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "app/**"
      - "src/**"
      - "data/**"
      - "public/**"
      - "asset-catalog/**"
      - "scripts/**"
      - "e2e/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig*.json"
      - "next.config.ts"
      - "eslint.config.mjs"
      - "vitest.config.ts"
      - "playwright.config.ts"
      - "playwright.combat.config.ts"
      - "playwright.reuse.config.ts"
      - "playwright.webgpu.config.ts"
      - ".github/workflows/validate.yml"
  workflow_dispatch:
    inputs:
      enable_combat_e2e:
        description: "Run combat-only Playwright after validate (no map/WebGPU). Prefer combat-e2e.yml for combat-only runs."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # Rebuild from data/canonical/, migrations, and patches; audit shipped data.
      - name: Audit data platform
        run: npm run audit:data
      # Icon index, reward aliases, path uniqueness, alsoAt duplicates.
      - name: Audit art
        run: npm run art:check
      # Combat layer boundaries (scripts/architecture/check.mjs).
      - name: Audit architecture
        run: npm run audit:architecture
      # Clean-export hygiene (agent tooling / secrets-shaped strings).
      - name: Audit release export
        run: npm run audit:release
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Run unit tests
        id: unit-tests
        shell: bash
        run: |
          set +e
          npm test > vitest.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 120 vitest.log
            exit "$status"
          fi
          cat vitest.log
      - name: Upload unit-test failure log
        if: failure() && steps.unit-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-failure
          path: vitest.log
          if-no-files-found: error
          retention-days: 3
      - name: Build
        run: npm run build

  # Combat-only Playwright: no map/WebGPU. Off unless workflow_dispatch sets
  # enable_combat_e2e=true. Prefer dedicated combat-e2e.yml for combat-only runs.
  # e2e/smoke.spec.ts is route smoke (default suite); e2e/combat.spec.ts is
  # full combat UI and is dispatch-only under CI.
  combat-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_combat_e2e == true }}
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Combat E2E
        id: combat-e2e
        env:
          CI: "1"
          PLAYWRIGHT_WORKERS: "1"
        run: npm run test:e2e:combat
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: combat-e2e-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 5
