<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Equilibrium II Regional Combat Unlocks</title>
<style>
:root{--ink:#f1e9d6;--muted:#c4b59a;--gold:#e0b264;--green:#183224;--green2:#2f7a47;--stone:#211f19;--dark:#12100c;--mono:ui-monospace,"Cascadia Mono",Consolas,monospace;--display:"Cinzel","Trajan Pro",Georgia,serif}
*{box-sizing:border-box}html{background:#10180f;color:var(--ink);font-family:system-ui,"Segoe UI",sans-serif}body{margin:0;background:#111a10}button,input{font:inherit}button{color:inherit}:focus-visible{outline:2px solid #57e0ae;outline-offset:2px}.poster{width:min(100%,1460px);min-height:100vh;margin:auto;border:3px solid #316648;background:#280b09;box-shadow:0 0 0 2px #122117}.layout{display:grid;grid-template-columns:minmax(0,2.08fr) minmax(330px,1fr)}.regional{min-width:0;border-right:10px solid #244733}.masthead{min-height:150px;display:grid;place-items:center;padding:24px;text-align:center;background:linear-gradient(#ffffff08,transparent),var(--green);border-bottom:8px solid #102117}.crests{display:flex;justify-content:center;gap:4px;margin-bottom:-5px}.crests img{width:24px;height:24px;object-fit:contain;filter:drop-shadow(0 1px 1px #0006)}h1{margin:0;display:grid;line-height:.9;font-family:var(--display)}h1 span:first-child{font-size:clamp(24px,3vw,42px)}h1 span:nth-child(2){font-size:14px;letter-spacing:.32em;color:var(--gold)}h1 span:last-child{font-size:clamp(27px,3.2vw,45px);color:#55b574}.regions{display:grid;gap:8px;padding-bottom:8px;background:#3b0d0d}.region{--bg:#555;--fg:#fff;min-height:174px;display:grid;grid-template-columns:112px minmax(0,1fr);background:linear-gradient(90deg,#0002,transparent 30%,#fff1),var(--bg);color:var(--fg);border-block:1px solid #ffffff25}.region[data-region=misthalin]{--bg:#1261bd}.region[data-region=havenhythe]{--bg:#735e77}.region[data-region=karamja]{--bg:#79af14}.region[data-region=asgarnia]{--bg:#c75b18}.region[data-region=kandarin]{--bg:#c91e31}.region[data-region=fremennik]{--bg:#70503e}.region[data-region=forinthry]{--bg:#4d4f54}.region[data-region=desert]{--bg:#d3bd08;--fg:#171405}.region[data-region=morytania]{--bg:#08736b}.region[data-region=tirannwn]{--bg:#079356}.region[data-region=anachronia]{--bg:#8c4b2e}.region-id{position:relative;display:grid;place-items:center;padding:26px 8px 8px;background:#0003;border-right:1px solid #0004}.region-id h2{position:absolute;top:7px;left:8px;max-width:calc(100% - 16px);margin:0;padding:2px 5px;color:#fff;background:#1118;border:2px solid #fff;box-shadow:1px 1px #111;font:800 10px/1 var(--mono);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.region-id img{width:60px;height:68px;object-fit:contain;filter:drop-shadow(1px 2px 0 #0005)}.count{position:absolute;right:6px;bottom:4px;font:700 10px var(--mono)}.items{min-width:0;display:grid;grid-auto-flow:column;grid-auto-columns:40px;grid-template-rows:repeat(3,minmax(44px,1fr));align-items:center;gap:4px;padding:12px 10px;overflow-x:auto;overflow-y:hidden}.item{position:relative;width:40px;height:44px;padding:0;border:0;background:transparent;display:grid;place-items:center;cursor:pointer}.item:hover{background:#0003;box-shadow:inset 0 0 0 1px #fff6}.item img{max-width:36px;max-height:36px;object-fit:contain;filter:drop-shadow(0 1px 1px #0004)}.fallback{width:30px;height:30px;display:grid;place-items:center;border:1px solid #fff6;background:#0004;font:800 10px var(--mono)}.multi{position:absolute;right:0;bottom:0;padding:1px 2px;background:#fff;color:#111;border:1px solid #111;font:800 8px var(--mono)}.sidebar{min-width:0;min-height:100vh;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;background:var(--stone)}.side-title{margin:0;padding:17px;text-align:center;background:#4b4537;font:700 13px var(--mono);letter-spacing:.22em;text-transform:uppercase}.search{display:grid;grid-template-columns:1fr auto;gap:7px;padding:13px 18px 7px}.search input,.search button,.actions button{height:34px;border:1px solid #5d5544;background:#17150f;color:var(--ink)}.search input{min-width:0;padding:0 9px}.search button{width:40px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:0 18px 10px}.actions button{cursor:pointer}.actions button:hover,.search button:hover{background:#292318}.combos{padding:10px 18px 18px 28px;overflow:auto}.combo{position:relative;width:100%;min-height:66px;padding:5px 0 8px 17px;display:grid;grid-template-columns:34px 1fr;gap:8px;text-align:left;border:0;background:transparent;color:inherit;cursor:pointer}.combo:before{content:"";position:absolute;left:0;top:7px;bottom:-5px;width:10px;border-left:2px solid #eee;border-top:2px solid #eee}.combo img{max-width:32px;max-height:32px;filter:drop-shadow(0 1px 1px #0004)}.combo strong{display:block;color:#e7db66;font-weight:500}.tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}.tag{padding:1px 4px;border:1px solid #fff;background:#333;font:800 8px var(--mono);text-transform:uppercase}.footer{padding:16px 20px 22px;font:11px/1.5 var(--mono)}dialog{width:min(720px,calc(100% - 24px));max-height:85vh;padding:0;color:var(--ink);background:#16120e;border:1px solid #6a563e}dialog::backdrop{background:#000b}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #6a563e}.dialog-head h2{margin:0;font-family:var(--display);color:#f0d08a}.dialog-head button{width:34px;height:34px;background:#100e0b;border:1px solid #6a563e}.dialog-body{display:grid;grid-template-columns:180px 1fr;gap:16px;padding:16px;overflow:auto}.dialog-art{min-height:150px;display:grid;place-items:center;background:#100e0b;border:1px solid #4a3d2c}.dialog-art img{max-width:140px;max-height:140px}.details{width:100%;border-collapse:collapse}.details th,.details td{padding:7px 8px;border-bottom:1px solid #4a3d2c;text-align:left;vertical-align:top}.details th{width:35%;color:#c4b59a}.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:#0a0806ee}.panel{width:min(480px,100%);padding:22px;background:#16120e;border:1px solid #6a563e}.panel h2{margin-top:0;color:#f0d08a}.panel label{display:inline-block;padding:9px 12px;background:#e0b264;color:#111;font-weight:700;cursor:pointer}.panel input{display:none}[hidden]{display:none!important}@media(max-width:980px){.layout{grid-template-columns:1fr}.regional{border-right:0}.sidebar{min-height:auto}}@media(max-width:620px){.region{grid-template-columns:90px minmax(0,1fr);min-height:150px}.items{grid-auto-columns:34px;grid-template-rows:repeat(3,minmax(38px,1fr))}.item{width:34px;height:38px}.item img{max-width:28px;max-height:28px}.dialog-body{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="poster" id="poster">
<div class="layout">
<section class="regional">
<header class="masthead"><div><div class="crests" id="crests"></div><h1><span>LEAGUES II</span><span>EQUILIBRIUM</span><span>Regional Unlocks</span></h1></div></header>
<div class="regions" id="regions"></div>
</section>
<aside class="sidebar">
<h2 class="side-title">★ Combo Item Unlocks ★</h2>
<div class="search"><input id="search" type="search" placeholder="Find an item"><button id="clear" type="button" aria-label="Clear search">×</button></div>
<div class="actions"><button id="save" type="button">Save .png</button><button id="export" type="button">Export deduped JSON</button></div>
<div class="combos" id="combos"></div>
<footer class="footer"><strong id="summary">Loading…</strong><div id="date"></div><div>RuneScape is a trademark of Jagex Ltd.</div></footer>
</aside>
</div>
</main>
<div class="overlay" id="overlay"><section class="panel"><h2>Open Equilibrium data</h2><p id="message">Loading the repository JSON files.</p><label>Choose JSON files<input id="files" type="file" accept=".json,application/json" multiple></label></section></div>
<dialog id="dialog"><header class="dialog-head"><h2 id="dialog-title">Equipment</h2><button id="close" type="button">×</button></header><div class="dialog-body" id="dialog-body"></div></dialog>
<script>
(()=>{"use strict";
const paths={regions:"./data/league/regions.json",equipment:"./data/combat/equipment.json",icons:"./data/combat/equipment-icon-slugs.json"};
const $=s=>document.querySelector(s),els={poster:$("#poster"),regions:$("#regions"),crests:$("#crests"),combos:$("#combos"),search:$("#search"),clear:$("#clear"),save:$("#save"),export:$("#export"),summary:$("#summary"),date:$("#date"),overlay:$("#overlay"),message:$("#message"),files:$("#files"),dialog:$("#dialog"),title:$("#dialog-title"),body:$("#dialog-body"),close:$("#close")};
const state={regions:[],raw:[],items:[],icons:new Set(),map:new Map(),query:""};
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;");
const slug=id=>String(id||"").replace(/^(item|equipment):/,"");
const initials=n=>String(n||"?").split(/\s+/).filter(Boolean).slice(0,3).map(x=>x[0]).join("").toUpperCase();
const human=v=>String(v||"").replace(/([a-z0-9])([A-Z])/g,"$1 $2").replaceAll("_"," ").replaceAll("-"," ").replace(/\b\w/g,c=>c.toUpperCase());
const norm=n=>String(n||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const uniq=a=>[...new Set((a||[]).filter(Boolean))];
const clone=o=>typeof structuredClone==="function"?structuredClone(o):JSON.parse(JSON.stringify(o));
function exact(records){const seen=new Set();return(Array.isArray(records)?records:[]).filter(r=>r?.id&&!seen.has(r.id)&&seen.add(r.id))}
function consolidate(records){const groups=new Map();for(const r of records){const key=[norm(r.name),r.style||"",r.slot||"",Number.isFinite(+r.tier)?+r.tier:"",r.setId||""].join("|");if(!groups.has(key)){const c=clone(r);c.aliasIds=[];groups.set(key,c);continue}const t=groups.get(key);t.aliasIds=uniq([...(t.aliasIds||[]),r.id]);t.unlock=t.unlock||{};t.unlock.regions=uniq([...(t.unlock.regions||[]),...(r.unlock?.regions||[])]);const req=uniq([t.unlock.requirement,r.unlock?.requirement]);if(req.length)t.unlock.requirement=req.join(" / ");if(!t.unlock.type&&r.unlock?.type)t.unlock.type=r.unlock.type;if(!t.displayDescription&&r.displayDescription)t.displayDescription=r.displayDescription;t.bonuses={...(r.bonuses||{}),...(t.bonuses||{})};const sm=new Map;for(const s of [...(t.sources||[]),...(r.sources||[])]){const k=[s?.source||"",s?.title||"",s?.url||""].join("|");if(k!=="||")sm.set(k,s)}t.sources=[...sm.values()]}return[...groups.values()]}
const regionsOf=i=>uniq(i?.unlock?.regions||[]);
const sort=a=>[...a].sort((x,y)=>(+y.tier||-1)-(+x.tier||-1)||String(x.name).localeCompare(String(y.name)));
function icon(i){const s=slug(i.id);return state.icons.has(s)?`<img src="./public/game/combat/equipment/${encodeURIComponent(s)}.webp" alt="" data-icon="${esc(i.id)}">`:`<span class="fallback" aria-label="No local icon">${esc(initials(i.name))}</span>`}
function tag(id){const r=state.regions.find(x=>x.id===id);return`<span class="tag">${esc(r?.name||human(id))}</span>`}
function searchable(i){return[i.name,i.id,i.style,i.slot,i.setId,i.displayDescription,i.unlock?.requirement,...regionsOf(i)].filter(Boolean).join(" ").toLowerCase()}
function render(){const q=state.query.trim().toLowerCase();els.crests.innerHTML=state.regions.map(r=>`<img src="./public/game/regions/${encodeURIComponent(r.id)}.webp" alt="">`).join("");els.regions.innerHTML=state.regions.map(r=>{const all=sort(state.items.filter(i=>regionsOf(i).includes(r.id))),shown=all.filter(i=>!q||searchable(i).includes(q));return`<section class="region" data-region="${esc(r.id)}"><div class="region-id"><h2>${esc(r.name)}</h2><img src="./public/game/regions/${encodeURIComponent(r.id)}.webp" alt=""><span class="count">${shown.length}/${all.length}</span></div><div class="items" aria-label="${esc(r.name)} equipment">${shown.map(i=>`<button class="item" type="button" data-id="${esc(i.id)}" aria-label="${esc(i.name)}">${icon(i)}${regionsOf(i).length>1?`<span class="multi">${regionsOf(i).length}R</span>`:""}</button>`).join("")||"No matches"}</div></section>`}).join("");const combos=sort(state.items.filter(i=>regionsOf(i).length>1&&(!q||searchable(i).includes(q))));els.combos.innerHTML=combos.map(i=>`<button class="combo" type="button" data-id="${esc(i.id)}"><span>${icon(i)}</span><span><strong>${esc(i.name)}</strong><span class="tags">${regionsOf(i).map(tag).join("")}</span></span></button>`).join("")||"No combo items match.";bindFallbacks()}
function bindFallbacks(){document.querySelectorAll("img[data-icon]").forEach(img=>img.addEventListener("error",()=>{const i=state.map.get(img.dataset.icon);const s=document.createElement("span");s.className="fallback";s.textContent=initials(i?.name);img.replaceWith(s)},{once:true}))}
function rows(i){const out=[];const add=(k,v)=>{if(v!==undefined&&v!==null&&v!=="")out.push(`<tr><th>${esc(k)}</th><td>${v}</td></tr>`)};add("Tier",esc(i.tier));add("Style",esc(human(i.style)));add("Slot",esc(human(i.slot)));add("Set",esc(i.setId));add("Requirement",esc(i.unlock?.requirement));add("Regions",regionsOf(i).map(tag).join(" "));for(const[k,v]of Object.entries(i.bonuses||{}))add(human(k),esc(v));return out.join("")}
function openItem(id){const i=state.map.get(id);if(!i)return;els.title.textContent=i.name;els.body.innerHTML=`<div class="dialog-art">${icon(i)}</div><table class="details"><tbody>${rows(i)}</tbody></table>`;bindFallbacks();els.dialog.showModal()}
function accept(rd,ed,icons){const rr=Array.isArray(rd)?rd:rd?.records,re=Array.isArray(ed)?ed:ed?.records;if(!Array.isArray(rr)||!Array.isArray(re)||!Array.isArray(icons))throw Error("Select regions.json, equipment.json, and equipment-icon-slugs.json.");state.regions=rr.filter(r=>r?.id&&r?.name);state.raw=exact(re);state.items=sort(consolidate(state.raw));state.icons=new Set(icons);state.map=new Map(state.items.map(i=>[i.id,i]));const removed=state.raw.length-state.items.length;els.summary.textContent=`${state.items.length} deduped items · ${state.items.filter(i=>state.icons.has(slug(i.id))).length} local icons${removed?` · ${removed} duplicates merged`:""}`;els.date.textContent=ed?.lastSynced?`Updated: ${ed.lastSynced}`:"";els.overlay.hidden=true;render()}
async function load(){try{accept(...await Promise.all(Object.values(paths).map(async p=>{const r=await fetch(p,{cache:"no-store"});if(!r.ok)throw Error(p);return r.json()})))}catch(e){els.message.textContent="Serve the repository root, or choose the three JSON files manually.";els.overlay.hidden=false}}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportJson(){const payload={generatedAt:new Date().toISOString(),sourceRecordCount:state.raw.length,consolidatedCount:state.items.length,records:state.items.map(i=>{const c=clone(i);if(!c.aliasIds?.length)delete c.aliasIds;return c})};download(new Blob([JSON.stringify(payload,null,2)+"\n"],{type:"application/json"}),"equilibrium-combat-items-deduped.json")}
async function savePng(){const w=Math.ceil(els.poster.getBoundingClientRect().width),h=Math.ceil(els.poster.scrollHeight),copy=els.poster.cloneNode(true),css=[...document.querySelectorAll("style")].map(s=>s.textContent).join("\n"),svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" style="width:${w}px;height:${h}px"><style>${css}</style>${copy.outerHTML}</div></foreignObject></svg>`,u=URL.createObjectURL(new Blob([svg],{type:"image/svg+xml"})),img=new Image;await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=u});const scale=Math.min(2,devicePixelRatio||1),c=document.createElement("canvas");c.width=w*scale;c.height=h*scale;const x=c.getContext("2d");x.scale(scale,scale);x.drawImage(img,0,0,w,h);URL.revokeObjectURL(u);download(await new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(),"image/png")),"equilibrium-regional-combat-unlocks.png")}
els.search.addEventListener("input",()=>{state.query=els.search.value;render()});els.clear.addEventListener("click",()=>{els.search.value="";state.query="";render()});els.export.addEventListener("click",exportJson);els.save.addEventListener("click",()=>savePng().catch(()=>alert("PNG export works best when the repository is served over http://localhost.")));document.addEventListener("click",e=>{const b=e.target.closest("[data-id]");if(b)openItem(b.dataset.id)});els.close.addEventListener("click",()=>els.dialog.close());els.dialog.addEventListener("click",e=>{if(e.target===els.dialog)els.dialog.close()});els.files.addEventListener("change",async()=>{try{const m=new Map;for(const f of els.files.files)m.set(f.name,JSON.parse(await f.text()));accept(m.get("regions.json"),m.get("equipment.json"),m.get("equipment-icon-slugs.json"))}catch(e){els.message.textContent=e.message}});load();
})();
</script>
</body>
</html>
