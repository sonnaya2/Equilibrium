<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Equilibrium II Regional Combat Unlocks</title>
  <style>
    :root {
      --ink: #f1e9d6;
      --muted: #c4b59a;
      --gold: #e0b264;
      --green-950: #101c14;
      --green-900: #183224;
      --green-800: #235136;
      --stone-950: #0a0806;
      --stone-900: #12100c;
      --stone-850: #18150f;
      --stone-800: #211f19;
      --stone-700: #5d5544;
      --display: "Cinzel", "Trajan Pro", Georgia, serif;
      --sans: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: #10180f; color: var(--ink); font-family: var(--sans); }
    body { min-height: 100vh; margin: 0; background: #111a10; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    img { display: block; }
    a { color: var(--gold); }
    :focus-visible { outline: 2px solid #57e0ae; outline-offset: 2px; }
    [hidden] { display: none !important; }

    .poster {
      width: min(100%, 1460px);
      min-height: 100vh;
      margin: 0 auto;
      overflow: hidden;
      border: 3px solid #316648;
      background: #25100e;
      box-shadow: 0 0 0 2px #122117, 0 18px 55px rgba(0, 0, 0, .5);
    }

    .layout { display: grid; grid-template-columns: minmax(0, 2.08fr) minmax(350px, 1fr); }
    .regional-column { min-width: 0; border-right: 10px solid #244733; }

    .masthead {
      min-height: 150px;
      display: grid;
      place-items: center;
      padding: 22px 30px;
      text-align: center;
      background: linear-gradient(180deg, rgba(255,255,255,.035), transparent 62%), var(--green-900);
      border-bottom: 8px solid var(--green-950);
    }

    .crest-chain { display: flex; justify-content: center; gap: 4px; min-height: 28px; margin-bottom: -4px; }
    .crest-chain img { width: 23px; height: 23px; object-fit: contain; filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
    .league-mark { display: grid; margin: 0; line-height: .9; font-family: var(--display); }
    .league-mark__top { font-size: clamp(24px, 3vw, 42px); }
    .league-mark__middle { color: var(--gold); font-size: 14px; letter-spacing: .33em; padding-left: .33em; }
    .league-mark__bottom { color: #55b574; font-size: clamp(27px, 3.2vw, 45px); }

    .region-list { display: grid; gap: 8px; padding-bottom: 8px; background: #301513; }
    .region-band {
      --region-bg: #555;
      --region-fg: #fff;
      min-height: 174px;
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      background: linear-gradient(90deg, rgba(0,0,0,.15), transparent 28%, rgba(255,255,255,.055)), var(--region-bg);
      color: var(--region-fg);
      border-block: 1px solid rgba(255,255,255,.14);
    }

    .region-band[data-region="misthalin"] { --region-bg: #1261bd; }
    .region-band[data-region="havenhythe"] { --region-bg: #735e77; }
    .region-band[data-region="karamja"] { --region-bg: #79af14; }
    .region-band[data-region="asgarnia"] { --region-bg: #c75b18; }
    .region-band[data-region="kandarin"] { --region-bg: #c91e31; }
    .region-band[data-region="fremennik"] { --region-bg: #70503e; }
    .region-band[data-region="forinthry"] { --region-bg: #4d4f54; }
    .region-band[data-region="desert"] { --region-bg: #d3bd08; --region-fg: #171405; }
    .region-band[data-region="morytania"] { --region-bg: #08736b; }
    .region-band[data-region="tirannwn"] { --region-bg: #079356; }
    .region-band[data-region="anachronia"] { --region-bg: #8c4b2e; }
    .region-band:is([data-region="fremennik"], [data-region="havenhythe"], [data-region="karamja"], [data-region="kandarin"]) { min-height: 78px; }

    .region-identity {
      position: relative;
      display: grid;
      place-items: center;
      padding: 27px 8px 8px;
      background: rgba(0,0,0,.2);
      border-right: 1px solid rgba(0,0,0,.3);
    }

    .region-name {
      position: absolute;
      top: 7px;
      left: 8px;
      max-width: calc(100% - 16px);
      margin: 0;
      padding: 2px 5px 3px;
      overflow: hidden;
      color: #fff;
      background: rgba(17,17,17,.66);
      border: 2px solid #fff;
      box-shadow: 1px 1px 0 #111;
      font: 800 10px/1 var(--mono);
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .region-crest { width: 60px; height: 68px; object-fit: contain; filter: drop-shadow(1px 2px 0 rgba(0,0,0,.28)); }
    .region-count { position: absolute; right: 6px; bottom: 4px; font: 700 10px var(--mono); }
    .region-band:is([data-region="fremennik"], [data-region="havenhythe"], [data-region="karamja"], [data-region="kandarin"]) .region-crest { width: 42px; height: 46px; }
    .region-band:is([data-region="fremennik"], [data-region="havenhythe"], [data-region="karamja"], [data-region="kandarin"]) .region-identity { padding-top: 24px; }

    .region-items {
      min-width: 0;
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 38px;
      grid-template-rows: repeat(3, minmax(44px, 1fr));
      align-items: center;
      gap: 4px;
      padding: 12px 10px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.42) rgba(0,0,0,.16);
    }

    .region-band:is([data-region="fremennik"], [data-region="havenhythe"], [data-region="karamja"], [data-region="kandarin"]) .region-items {
      grid-template-rows: 52px;
      grid-auto-columns: 42px;
      padding-block: 10px;
    }

    .item-button {
      position: relative;
      width: 38px;
      height: 44px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      background: transparent;
    }

    .item-button:hover,
    .item-button:focus-visible { background: rgba(0,0,0,.2); box-shadow: inset 0 0 0 1px rgba(255,255,255,.42); }
    .item-button img { max-width: 32px; max-height: 32px; object-fit: contain; filter: drop-shadow(0 1px 1px rgba(0,0,0,.2)); }
    .item-fallback { width: 30px; height: 30px; display: grid; place-items: center; color: rgba(255,255,255,.9); background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.42); font: 800 9px/1 var(--mono); }
    .member-count, .combo-count {
      position: absolute;
      right: 0;
      bottom: 0;
      padding: 1px 3px;
      color: #111;
      background: #fff;
      border: 1px solid #111;
      font: 900 8px/1 var(--mono);
    }
    .combo-count { left: 0; right: auto; color: #fff; background: #111; border-color: #fff; }

    .sidebar {
      min-width: 0;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr) auto;
      background: var(--stone-800);
    }

    .sidebar-heading {
      margin: 0;
      padding: 18px 16px;
      text-align: center;
      background: #4b4537;
      font: 700 13px var(--mono);
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .sidebar-tools { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 7px; padding: 13px 18px 7px; }
    .sidebar-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; padding: 0 18px 10px; }
    .search-field, .clear-button, .tool-button {
      height: 35px;
      color: var(--ink);
      background: #17150f;
      border: 1px solid var(--stone-700);
      border-radius: 0;
    }
    .search-field { min-width: 0; width: 100%; padding: 0 9px; }
    .clear-button { width: 40px; }
    .tool-button { padding-inline: 8px; }
    .tool-button:hover, .clear-button:hover { background: #292318; }
    .tool-button:disabled { cursor: wait; opacity: .65; }

    .combo-list { min-height: 0; padding: 10px 18px 18px 28px; overflow: auto; }
    .combo-empty { color: var(--muted); line-height: 1.5; }
    .combo-item {
      position: relative;
      width: 100%;
      min-height: 66px;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 8px;
      padding: 5px 0 8px 17px;
      color: inherit;
      text-align: left;
      background: transparent;
      border: 0;
    }
    .combo-item::before { content: ""; position: absolute; left: 0; top: 7px; bottom: -5px; width: 10px; border-left: 2px solid #eee; border-top: 2px solid #eee; }
    .combo-icon { position: relative; width: 34px; height: 34px; display: grid; place-items: center; }
    .combo-icon img { max-width: 31px; max-height: 31px; object-fit: contain; filter: drop-shadow(0 1px 1px rgba(0,0,0,.2)); }
    .combo-name { display: block; color: #e7db66; font-weight: 550; }
    .region-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
    .region-tag { padding: 1px 4px; color: #fff; background: #333; border: 1px solid #fff; font: 800 8px var(--mono); text-transform: uppercase; }
    .sidebar-footer { padding: 16px 20px 22px; font: 11px/1.5 var(--mono); }

    .overlay { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 20px; background: rgba(10,8,6,.94); }
    .status-panel { width: min(510px, 100%); padding: 22px; background: var(--stone-850); border: 1px solid #6a563e; }
    .status-panel h2 { margin-top: 0; color: #f0d08a; font-family: var(--display); }
    .status-panel p { color: var(--muted); line-height: 1.55; }
    .status-panel label { display: inline-block; padding: 9px 12px; color: #111; background: var(--gold); font-weight: 700; cursor: pointer; }
    .status-panel input { display: none; }

    dialog { width: min(760px, calc(100% - 24px)); max-height: 86vh; padding: 0; color: var(--ink); background: var(--stone-850); border: 1px solid #6a563e; }
    dialog::backdrop { background: rgba(0,0,0,.76); }
    .dialog-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid #6a563e; }
    .dialog-header h2 { margin: 0; color: #f0d08a; font-family: var(--display); }
    .dialog-close { width: 35px; height: 35px; background: var(--stone-900); border: 1px solid #6a563e; }
    .dialog-body { display: grid; grid-template-columns: 180px 1fr; gap: 16px; padding: 16px; overflow: auto; }
    .dialog-art { min-height: 150px; display: grid; place-items: center; background: var(--stone-900); border: 1px solid #4a3d2c; }
    .dialog-art img { max-width: 140px; max-height: 140px; }
    .detail-table { width: 100%; border-collapse: collapse; }
    .detail-table th, .detail-table td { padding: 7px 8px; border-bottom: 1px solid #4a3d2c; text-align: left; vertical-align: top; }
    .detail-table th { width: 35%; color: var(--muted); }
    .member-list { grid-column: 1 / -1; margin: 0; padding: 12px 14px 12px 32px; background: var(--stone-900); border: 1px solid #4a3d2c; columns: 2; }
    .member-list li { break-inside: avoid; margin-bottom: 4px; }

    .visually-hidden { position: absolute !important; width: 1px !important; height: 1px !important; overflow: hidden !important; clip: rect(0 0 0 0) !important; white-space: nowrap !important; }

    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .regional-column { border-right: 0; }
      .sidebar { min-height: auto; border-top: 8px solid #244733; }
    }

    @media (max-width: 620px) {
      .poster { border-width: 2px; }
      .masthead { min-height: 126px; padding: 18px 12px; }
      .crest-chain img { width: 18px; height: 18px; }
      .region-band { grid-template-columns: 90px minmax(0,1fr); min-height: 150px; }
      .region-band:is([data-region="fremennik"], [data-region="havenhythe"], [data-region="karamja"], [data-region="kandarin"]) { min-height: 70px; }
      .region-items { grid-auto-columns: 33px; grid-template-rows: repeat(3, minmax(38px,1fr)); }
      .item-button { width: 33px; height: 38px; }
      .item-button img { max-width: 27px; max-height: 27px; }
      .dialog-body { grid-template-columns: 1fr; }
      .member-list { grid-column: auto; columns: 1; }
    }
  </style>
</head>
<body>
  <main class="poster" id="poster" aria-labelledby="page-title">
    <div class="layout">
      <section class="regional-column" aria-label="Regional combat unlocks">
        <header class="masthead">
          <div>
            <div class="crest-chain" id="crest-chain" aria-hidden="true"></div>
            <h1 class="league-mark" id="page-title">
              <span class="league-mark__top">LEAGUES II</span>
              <span class="league-mark__middle">EQUILIBRIUM</span>
              <span class="league-mark__bottom">Regional Unlocks</span>
            </h1>
          </div>
        </header>
        <div class="region-list" id="region-list" aria-live="polite"></div>
      </section>

      <aside class="sidebar" aria-labelledby="combo-heading">
        <h2 class="sidebar-heading" id="combo-heading">★ Combo Item Unlocks ★</h2>
        <div class="sidebar-tools">
          <label>
            <span class="visually-hidden">Find equipment</span>
            <input class="search-field" id="search" type="search" placeholder="Find an item" autocomplete="off">
          </label>
          <button class="clear-button" id="clear-search" type="button" aria-label="Clear search">×</button>
        </div>
        <div class="sidebar-actions">
          <button class="tool-button" id="save-png" type="button">Save .png</button>
          <a class="tool-button" id="json-link" href="./data/combat/equipment-showcase.json" download style="display:grid;place-items:center;text-decoration:none">Showcase JSON</a>
        </div>
        <div class="combo-list" id="combo-list"></div>
        <footer class="sidebar-footer">
          <strong id="record-line">Loading equipment…</strong>
          <div id="date-line"></div>
          <div><a href="./NOTICE" target="_blank" rel="noreferrer">Sources and licensing</a></div>
          <div>RuneScape is a trademark of Jagex Ltd.</div>
        </footer>
      </aside>
    </div>
  </main>

  <div class="overlay" id="status-overlay">
    <section class="status-panel" role="status" aria-live="polite">
      <h2 id="status-title">Loading Equilibrium data</h2>
      <p id="status-copy">Reading the generated showcase, canonical regions, and local icon allowlist.</p>
      <label id="file-label" hidden>Choose JSON files<input id="file-input" type="file" accept="application/json,.json" multiple></label>
    </section>
  </div>

  <dialog id="item-dialog" aria-labelledby="dialog-title">
    <header class="dialog-header">
      <h2 id="dialog-title">Equipment</h2>
      <button class="dialog-close" id="dialog-close" type="button" aria-label="Close item details">×</button>
    </header>
    <div class="dialog-body" id="dialog-body"></div>
  </dialog>

  <script>
    (() => {
      "use strict";

      const paths = {
        regions: "./data/league/regions.json",
        showcase: "./data/combat/equipment-showcase.json",
        icons: "./data/combat/equipment-icon-slugs.json"
      };

      const regionColors = {
        misthalin: "#1261bd", havenhythe: "#735e77", karamja: "#79af14", asgarnia: "#c75b18",
        kandarin: "#c91e31", fremennik: "#70503e", forinthry: "#4d4f54", desert: "#d3bd08",
        morytania: "#08736b", tirannwn: "#079356", anachronia: "#8c4b2e"
      };

      const compactRegions = new Set(["fremennik", "havenhythe", "karamja", "kandarin"]);

      const elements = {
        poster: document.querySelector("#poster"),
        regionList: document.querySelector("#region-list"),
        comboList: document.querySelector("#combo-list"),
        crestChain: document.querySelector("#crest-chain"),
        search: document.querySelector("#search"),
        clearSearch: document.querySelector("#clear-search"),
        savePng: document.querySelector("#save-png"),
        recordLine: document.querySelector("#record-line"),
        dateLine: document.querySelector("#date-line"),
        overlay: document.querySelector("#status-overlay"),
        statusTitle: document.querySelector("#status-title"),
        statusCopy: document.querySelector("#status-copy"),
        fileLabel: document.querySelector("#file-label"),
        fileInput: document.querySelector("#file-input"),
        dialog: document.querySelector("#item-dialog"),
        dialogTitle: document.querySelector("#dialog-title"),
        dialogBody: document.querySelector("#dialog-body"),
        dialogClose: document.querySelector("#dialog-close")
      };

      const state = { regions: [], items: [], itemById: new Map(), iconSlugs: new Set(), query: "", meta: null, lastTrigger: null };
      const imageCache = new Map();

      const escapeHtml = (value) => String(value ?? "")
        .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;").replaceAll("'", "&#39;");
      const slugFromId = (id) => String(id || "").replace(/^(?:item|equipment):/, "");
      const humanize = (value) => String(value || "").replace(/([a-z0-9])([A-Z])/g, "$1 $2").replaceAll("_", " ").replaceAll("-", " ").replace(/\b\w/g, (letter) => letter.toUpperCase());
      const initials = (name) => String(name || "?").split(/\s+/).filter(Boolean).slice(0, 3).map((part) => part[0]).join("").toUpperCase();

      function iconPath(item) {
        const id = item.iconId || item.id;
        const slug = slugFromId(id);
        return state.iconSlugs.has(slug) ? `./public/game/combat/equipment/${encodeURIComponent(slug)}.webp` : null;
      }

      function itemSearchText(item) {
        return [item.name, item.style, item.slots?.join(" "), item.displayDescription, item.unlock?.requirement,
          ...(item.members || []).map((member) => member.name),
          ...(item.regions || []).map((id) => state.regions.find((region) => region.id === id)?.name || id)
        ].filter(Boolean).join(" ").toLowerCase();
      }

      function visibleItems(items) {
        const query = state.query.trim().toLowerCase();
        return items.filter((item) => !query || itemSearchText(item).includes(query));
      }

      function regionTag(regionId) {
        const region = state.regions.find((entry) => entry.id === regionId);
        return `<span class="region-tag" style="background:${escapeHtml(regionColors[regionId] || "#333")}">${escapeHtml(region?.name || humanize(regionId))}</span>`;
      }

      function iconMarkup(item, className = "") {
        const path = iconPath(item);
        if (!path) return `<span class="item-fallback" aria-label="No local icon">${escapeHtml(initials(item.name))}</span>`;
        return `<img class="${escapeHtml(className)}" src="${path}" alt="" loading="lazy" decoding="async">`;
      }

      function renderCrests() {
        elements.crestChain.innerHTML = state.regions.map((region) => `<img src="./public/game/regions/${encodeURIComponent(region.id)}.webp" alt="">`).join("");
      }

      function renderRegions() {
        elements.regionList.innerHTML = state.regions.map((region) => {
          const all = state.items.filter((item) => item.regions?.includes(region.id));
          const items = visibleItems(all);
          const rows = compactRegions.has(region.id) ? 1 : 3;
          const controls = items.map((item) => `<button class="item-button" type="button" data-item-id="${escapeHtml(item.id)}" aria-label="${escapeHtml(item.name)}" title="${escapeHtml(item.name)}">
            ${iconMarkup(item)}
            ${item.memberCount > 1 ? `<span class="member-count">${item.kind === "set" ? "SET" : `×${item.memberCount}`}</span>` : ""}
            ${item.regions?.length > 1 ? `<span class="combo-count">${item.regions.length}R</span>` : ""}
          </button>`).join("");

          return `<section class="region-band" data-region="${escapeHtml(region.id)}" aria-labelledby="region-${escapeHtml(region.id)}">
            <div class="region-identity">
              <h2 class="region-name" id="region-${escapeHtml(region.id)}">${escapeHtml(region.name)}</h2>
              <img class="region-crest" src="./public/game/regions/${encodeURIComponent(region.id)}.webp" alt="">
              <span class="region-count">${items.length}/${all.length}</span>
            </div>
            <div class="region-items" style="--rows:${rows}" tabindex="0" aria-label="${escapeHtml(region.name)} equipment">
              ${controls || `<span>No matches</span>`}
            </div>
          </section>`;
        }).join("");
      }

      function renderCombos() {
        const combos = visibleItems(state.items.filter((item) => item.regions?.length > 1));
        elements.comboList.innerHTML = combos.length ? combos.map((item) => `<button class="combo-item" type="button" data-item-id="${escapeHtml(item.id)}">
          <span class="combo-icon">${iconMarkup(item)}${item.memberCount > 1 ? `<span class="member-count">${item.kind === "set" ? "SET" : `×${item.memberCount}`}</span>` : ""}</span>
          <span><span class="combo-name">${escapeHtml(item.name)}</span><span class="region-tags">${item.regions.map(regionTag).join("")}</span></span>
        </button>`).join("") : `<p class="combo-empty">No combo unlocks match the current search.</p>`;
      }

      function render() { renderCrests(); renderRegions(); renderCombos(); }

      function detailRows(item) {
        const rows = [];
        const add = (label, value) => { if (value !== undefined && value !== null && value !== "" && (!Array.isArray(value) || value.length)) rows.push(`<tr><th scope="row">${escapeHtml(label)}</th><td>${value}</td></tr>`); };
        add("Type", escapeHtml(humanize(item.kind)));
        add("Tier", item.tierRange ? `${item.tierRange[0]}–${item.tierRange[1]}` : escapeHtml(item.tier));
        add("Combat style", escapeHtml(humanize(item.style)));
        add("Slots", escapeHtml((item.slots || []).map(humanize).join(", ")));
        add("Regions", (item.regions || []).map(regionTag).join(" "));
        add("Unlock", escapeHtml(item.unlock?.requirement));
        if (item.bonuses && typeof item.bonuses === "object") for (const [key, value] of Object.entries(item.bonuses)) add(humanize(key), escapeHtml(value));
        return rows.join("");
      }

      function openItem(itemId, trigger) {
        const item = state.itemById.get(itemId);
        if (!item) return;
        state.lastTrigger = trigger || document.activeElement;
        elements.dialogTitle.textContent = item.name;
        elements.dialogBody.innerHTML = `<div class="dialog-art">${iconMarkup(item)}</div><table class="detail-table"><tbody>${detailRows(item)}</tbody></table>
          ${item.members?.length > 1 ? `<ul class="member-list">${item.members.map((member) => `<li>${escapeHtml(member.name)}${member.tier ? ` (T${escapeHtml(member.tier)})` : ""}</li>`).join("")}</ul>` : ""}`;
        elements.dialog.showModal();
      }

      function closeItem() { if (elements.dialog.open) elements.dialog.close(); state.lastTrigger?.focus?.(); }

      async function fetchJson(path) {
        const response = await fetch(path, { cache: "no-store" });
        if (!response.ok) throw new Error(`${path}: ${response.status}`);
        return response.json();
      }

      function acceptData(regionsData, showcaseData, iconsData) {
        const regions = Array.isArray(regionsData) ? regionsData : regionsData?.records;
        const records = Array.isArray(showcaseData) ? showcaseData : showcaseData?.records;
        if (!Array.isArray(regions) || !Array.isArray(records) || !Array.isArray(iconsData)) throw new Error("Select regions.json, equipment-showcase.json, and equipment-icon-slugs.json.");
        state.regions = regions.filter((region) => region?.id && region?.name);
        state.items = records.filter((item) => item?.id);
        state.itemById = new Map(state.items.map((item) => [item.id, item]));
        state.iconSlugs = new Set(iconsData);
        state.meta = showcaseData;
        elements.recordLine.textContent = `${state.items.length} cleaned showcase entries · ${showcaseData.collapsedCount || 0} redundant pieces collapsed`;
        elements.dateLine.textContent = showcaseData.generatedAt ? `Generated: ${showcaseData.generatedAt}` : "";
        elements.overlay.hidden = true;
        render();
      }

      async function loadData() {
        try {
          const [regions, showcase, icons] = await Promise.all([fetchJson(paths.regions), fetchJson(paths.showcase), fetchJson(paths.icons)]);
          acceptData(regions, showcase, icons);
        } catch (error) {
          elements.statusTitle.textContent = "Serve the repository or choose the JSON files";
          elements.statusCopy.textContent = "The page now uses regions.json, equipment-showcase.json, and equipment-icon-slugs.json. Choose the three JSON files when opening the HTML directly. The PNG button downloads the generated PNG beside this file.";
          elements.fileLabel.hidden = false;
          console.warn(error);
        }
      }

      async function readFiles(files) {
        const parsed = new Map();
        for (const file of files) if (file.name.endsWith(".json")) parsed.set(file.name, JSON.parse(await file.text()));
        acceptData(parsed.get("regions.json"), parsed.get("equipment-showcase.json"), parsed.get("equipment-icon-slugs.json"));
      }

      function loadImage(src) {
        if (imageCache.has(src)) return imageCache.get(src);
        const promise = new Promise((resolve) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => resolve(null);
          image.src = src;
        });
        imageCache.set(src, promise);
        return promise;
      }

      function drawContain(context, image, x, y, width, height) {
        if (!image) return;
        const scale = Math.min(width / image.naturalWidth, height / image.naturalHeight);
        const w = image.naturalWidth * scale;
        const h = image.naturalHeight * scale;
        context.drawImage(image, x + (width - w) / 2, y + (height - h) / 2, w, h);
      }

      function drawText(context, text, x, y, maxWidth, lineHeight = 17) {
        const words = String(text).split(/\s+/);
        let line = "";
        for (const word of words) {
          const test = line ? `${line} ${word}` : word;
          if (context.measureText(test).width > maxWidth && line) {
            context.fillText(line, x, y);
            line = word;
            y += lineHeight;
          } else line = test;
        }
        if (line) context.fillText(line, x, y);
        return y;
      }

      async function savePng() {
        elements.savePng.disabled = true;
        elements.savePng.textContent = "Downloading…";
        const link = document.createElement("a");
        link.href = "./equilibrium-regional-combat-unlocks.png";
        link.download = "equilibrium-regional-combat-unlocks.png";
        document.body.append(link);
        link.click();
        link.remove();
      }

      elements.search.addEventListener("input", () => { state.query = elements.search.value; renderRegions(); renderCombos(); });
      elements.clearSearch.addEventListener("click", () => { elements.search.value = ""; state.query = ""; renderRegions(); renderCombos(); elements.search.focus(); });
      elements.fileInput.addEventListener("change", async () => { try { await readFiles([...elements.fileInput.files]); } catch (error) { elements.statusCopy.textContent = error.message; } });
      elements.savePng.addEventListener("click", async () => {
        try { await savePng(); }
        catch (error) { alert(error.message); console.error(error); }
        finally { elements.savePng.disabled = false; elements.savePng.textContent = "Save .png"; }
      });
      document.addEventListener("click", (event) => { const button = event.target.closest("[data-item-id]"); if (button) openItem(button.dataset.itemId, button); });
      elements.dialogClose.addEventListener("click", closeItem);
      elements.dialog.addEventListener("cancel", (event) => { event.preventDefault(); closeItem(); });
      elements.dialog.addEventListener("click", (event) => { if (event.target === elements.dialog) closeItem(); });

      loadData();
    })();
  </script>
</body>
</html>
