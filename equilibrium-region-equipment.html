<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Equilibrium II Regional Combat Unlocks</title>
  <style>
    :root {
      --ink: #f1e9d6;
      --muted: #c4b59a;
      --stone-950: #0a0806;
      --stone-900: #100e0b;
      --stone-850: #16120e;
      --stone-800: #1f1912;
      --stone-750: #4a3d2c;
      --stone-carve: #6a563e;
      --gold-300: #f0d08a;
      --gold-400: #e0b264;
      --gem-300: #57e0ae;
      --red-950: #260000;
      --red-900: #390000;
      --poster-max: 1460px;
      --display: "Cinzel", "Trajan Pro", Georgia, serif;
      --sans: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: #160000; color: var(--ink); font-family: var(--sans); scrollbar-color: var(--stone-carve) var(--stone-950); }
    body { min-height: 100vh; margin: 0; background: linear-gradient(90deg, rgba(0,0,0,.22), transparent 12%, transparent 88%, rgba(0,0,0,.22)), #180000; }
    button, input { font: inherit; }
    button { color: inherit; }
    img { display: block; }
    a { color: var(--gold-300); }
    :focus-visible { outline: 2px solid var(--gem-300); outline-offset: 2px; }

    .poster {
      position: relative;
      width: min(100%, var(--poster-max));
      min-height: 100vh;
      margin: 0 auto;
      overflow: hidden;
      border: 3px solid #8d1008;
      background: var(--red-950);
      box-shadow: 0 0 0 2px #240000, 0 18px 60px rgba(0,0,0,.55);
    }

    .poster::before, .poster::after, .poster-corner::before, .poster-corner::after {
      content: "";
      position: absolute;
      z-index: 20;
      width: 46px;
      height: 46px;
      pointer-events: none;
      background: linear-gradient(135deg, transparent 0 27%, #be2c19 28% 31%, transparent 32%), linear-gradient(45deg, transparent 0 50%, #6f120a 51% 55%, transparent 56%), radial-gradient(circle at 13px 13px, #d49a35 0 2px, transparent 3px), #3a0703;
      border: 1px solid #d24c27;
      clip-path: polygon(0 0, 100% 0, 0 100%);
    }

    .poster::before { left: 0; top: 0; }
    .poster::after { right: 0; top: 0; transform: rotate(90deg); }
    .poster-corner::before { left: 0; bottom: 0; transform: rotate(270deg); }
    .poster-corner::after { right: 0; bottom: 0; transform: rotate(180deg); }

    .layout { display: grid; grid-template-columns: minmax(0, 2.08fr) minmax(330px, 1fr); min-height: calc(100vh - 6px); }
    .regional-column { min-width: 0; border-right: 11px solid #450000; background: #2b0000; }

    .masthead {
      min-height: 150px;
      padding: 26px 42px 22px;
      display: grid;
      place-items: center;
      text-align: center;
      background: linear-gradient(180deg, rgba(255,255,255,.025), transparent 55%), var(--red-900);
      border-bottom: 8px solid #270000;
    }

    .crest-chain { display: flex; justify-content: center; align-items: center; gap: 4px; min-height: 30px; margin-bottom: -8px; }
    .crest-chain img { width: 24px; height: 24px; object-fit: contain; filter: drop-shadow(0 1px 1px #000); }
    .league-mark { display: grid; gap: 1px; line-height: .86; text-shadow: 0 2px 0 #000, 0 0 12px rgba(224,178,100,.18); }
    .league-mark__top { color: #dfd5c2; font-family: var(--display); font-size: clamp(22px, 3vw, 42px); font-weight: 800; letter-spacing: -.04em; }
    .league-mark__middle { color: var(--gold-400); font-family: var(--display); font-size: clamp(12px, 1.25vw, 17px); font-weight: 700; letter-spacing: .36em; padding-left: .36em; }
    .league-mark__bottom { display: flex; justify-content: center; align-items: center; gap: .32em; color: #ba190f; font-family: var(--display); font-size: clamp(25px, 3.25vw, 45px); font-weight: 800; letter-spacing: -.055em; }
    .league-mark__seal { width: 43px; height: 43px; display: grid; place-items: center; color: var(--gold-300); font-size: 16px; border: 2px solid #8d1008; background: #170e09; transform: rotate(45deg); box-shadow: inset 0 0 0 2px #3f2b1c; }
    .league-mark__seal span { transform: rotate(-45deg); }

    .region-list { display: grid; gap: 10px; padding-bottom: 10px; background: #400000; }
    .region-band {
      --region-bg: #595959;
      --region-ink: #fff;
      position: relative;
      min-height: 104px;
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      align-items: center;
      background: linear-gradient(90deg, rgba(0,0,0,.13), transparent 24%, transparent 84%, rgba(255,255,255,.05)), var(--region-bg);
      color: var(--region-ink);
      border-top: 1px solid rgba(255,255,255,.16);
      border-bottom: 1px solid rgba(0,0,0,.38);
      isolation: isolate;
    }

    .region-band[data-region="misthalin"] { --region-bg: #1261bd; }
    .region-band[data-region="havenhythe"] { --region-bg: #735e77; }
    .region-band[data-region="karamja"] { --region-bg: #79af14; }
    .region-band[data-region="asgarnia"] { --region-bg: #c75b18; }
    .region-band[data-region="kandarin"] { --region-bg: #c91e31; }
    .region-band[data-region="fremennik"] { --region-bg: #70503e; }
    .region-band[data-region="forinthry"] { --region-bg: #4d4f54; }
    .region-band[data-region="desert"] { --region-bg: #d3bd08; --region-ink: #1b1705; }
    .region-band[data-region="morytania"] { --region-bg: #08736b; }
    .region-band[data-region="tirannwn"] { --region-bg: #079356; }
    .region-band[data-region="anachronia"] { --region-bg: #8c4b2e; }

    .region-identity { position: relative; align-self: stretch; display: grid; place-items: center; padding: 24px 12px 8px; background: rgba(0,0,0,.18); border-right: 1px solid rgba(0,0,0,.25); }
    .region-name { position: absolute; top: 7px; left: 14px; z-index: 2; max-width: calc(100% - 22px); padding: 2px 6px 3px; overflow: hidden; color: #fff; font-family: var(--mono); font-size: 11px; font-weight: 800; line-height: 1; letter-spacing: .04em; text-overflow: ellipsis; text-transform: uppercase; white-space: nowrap; background: color-mix(in srgb, var(--region-bg) 84%, #111); border: 2px solid #fff; box-shadow: 2px 2px 0 #111; }
    .region-crest { width: 62px; height: 70px; object-fit: contain; filter: drop-shadow(2px 3px 0 rgba(0,0,0,.55)); }
    .region-count { position: absolute; right: 7px; bottom: 4px; color: rgba(255,255,255,.82); font-family: var(--mono); font-size: 10px; font-weight: 700; }

    .region-items { position: relative; min-width: 0; height: 100%; display: flex; align-items: center; gap: 4px; padding: 17px 12px 10px 8px; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.45) rgba(0,0,0,.16); }
    .region-items::-webkit-scrollbar { height: 6px; }
    .region-items::-webkit-scrollbar-track { background: rgba(0,0,0,.15); }
    .region-items::-webkit-scrollbar-thumb { background: rgba(255,255,255,.38); }
    .region-note { flex: 0 0 auto; min-width: 178px; align-self: stretch; display: grid; place-content: center; gap: 2px; padding: 8px 13px; text-align: right; color: currentColor; opacity: .95; }
    .region-note strong { font-family: var(--display); font-size: 17px; line-height: 1; }
    .region-note span { max-width: 195px; font-size: 11px; line-height: 1.25; }

    .item-button { position: relative; flex: 0 0 54px; width: 54px; height: 66px; padding: 0; display: grid; place-items: center; border: 0; background: transparent; cursor: pointer; }
    .item-button::after { content: ""; position: absolute; inset: 3px 2px; z-index: -1; opacity: 0; background: rgba(0,0,0,.22); border: 1px solid rgba(255,255,255,.42); transition: opacity 80ms ease; }
    .item-button:hover::after, .item-button:focus-visible::after { opacity: 1; }
    .item-button img { max-width: 50px; max-height: 61px; object-fit: contain; filter: drop-shadow(1px 2px 1px rgba(0,0,0,.55)); }
    .item-fallback { width: 43px; height: 43px; display: grid; place-items: center; color: rgba(255,255,255,.85); font-family: var(--mono); font-size: 12px; font-weight: 800; background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.35); }
    .combo-mark { position: absolute; right: 0; bottom: 1px; padding: 1px 3px; color: #111; font-family: var(--mono); font-size: 8px; font-weight: 900; line-height: 1.1; background: #fff; border: 1px solid #111; }

    .sidebar { position: relative; min-width: 0; min-height: 100vh; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; background: linear-gradient(90deg, rgba(255,255,255,.025), transparent 16%), #211f19; border-left: 1px solid #6d1a10; }
    .sidebar-heading { min-height: 55px; display: flex; align-items: center; justify-content: center; padding: 13px 22px 11px; color: #f5eee0; font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: .27em; text-align: center; text-transform: uppercase; background: #4b4537; clip-path: polygon(0 0, 100% 0, 100% 100%, 18px 100%, 0 72%); }
    .sidebar-tools { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 14px 20px 7px; }
    .search-field { min-width: 0; height: 34px; padding: 0 10px; color: var(--ink); background: #17150f; border: 1px solid #5d5544; border-radius: 0; }
    .search-field::placeholder { color: #908773; }
    .clear-button { min-width: 42px; height: 34px; padding: 0 9px; color: var(--muted); background: #17150f; border: 1px solid #5d5544; cursor: pointer; }
    .combo-list { min-height: 0; padding: 12px 20px 20px 34px; overflow: auto; scrollbar-width: thin; scrollbar-color: #716853 #17150f; }
    .combo-empty { padding: 30px 6px; color: #a99e87; font-size: 13px; line-height: 1.5; }

    .combo-item { position: relative; width: 100%; min-height: 75px; padding: 5px 3px 9px 18px; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 8px; align-items: start; color: inherit; text-align: left; background: transparent; border: 0; cursor: pointer; }
    .combo-item::before { content: ""; position: absolute; left: 0; top: 6px; bottom: -5px; width: 11px; border-left: 2px solid #f2eee5; border-top: 2px solid #f2eee5; }
    .combo-item:last-child::before { bottom: 31px; }
    .combo-item:hover .combo-name, .combo-item:focus-visible .combo-name { color: #fff3a8; }
    .combo-icon { width: 34px; height: 34px; display: grid; place-items: center; }
    .combo-icon img { max-width: 34px; max-height: 34px; object-fit: contain; filter: drop-shadow(1px 2px 1px #000); }
    .combo-icon .item-fallback { width: 30px; height: 30px; font-size: 9px; }
    .combo-copy { min-width: 0; }
    .combo-name { display: block; margin-bottom: 7px; color: #e6e760; font-family: var(--display); font-size: 15px; line-height: 1.15; transition: color 80ms ease; }
    .region-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .region-tag { --tag: #555; padding: 2px 5px 3px; color: #fff; font-family: var(--mono); font-size: 9px; font-weight: 900; line-height: 1; text-transform: uppercase; background: var(--tag); border: 2px solid #fff; box-shadow: 1px 1px 0 #111; }
    .region-tag[data-region="misthalin"] { --tag: #1261bd; }
    .region-tag[data-region="havenhythe"] { --tag: #735e77; }
    .region-tag[data-region="karamja"] { --tag: #79af14; }
    .region-tag[data-region="asgarnia"] { --tag: #c75b18; }
    .region-tag[data-region="kandarin"] { --tag: #c91e31; }
    .region-tag[data-region="fremennik"] { --tag: #70503e; }
    .region-tag[data-region="forinthry"] { --tag: #4d4f54; }
    .region-tag[data-region="desert"] { --tag: #c4ad00; color: #111; }
    .region-tag[data-region="morytania"] { --tag: #08736b; }
    .region-tag[data-region="tirannwn"] { --tag: #079356; }
    .region-tag[data-region="anachronia"] { --tag: #8c4b2e; }

    .sidebar-footer { min-height: 108px; display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: end; padding: 16px 22px 24px; color: #f3eee2; font-family: var(--mono); font-size: 11px; line-height: 1.45; }
    .sidebar-footer strong { display: block; margin-bottom: 4px; font-size: 14px; }
    .sidebar-footer a { color: inherit; text-decoration: none; border-bottom: 1px dotted #d8cfbd; }
    .footer-rune { color: var(--gold-400); font-family: var(--display); font-size: 34px; line-height: 1; opacity: .72; }

    .status-overlay { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; padding: 24px; background: rgba(10,8,6,.92); }
    .status-panel { width: min(480px, 100%); padding: 24px; color: var(--ink); background: var(--stone-850); border: 1px solid var(--stone-carve); box-shadow: inset 0 1px 0 #78654b; }
    .status-panel h2 { margin: 0 0 10px; color: var(--gold-300); font-family: var(--display); font-size: 22px; }
    .status-panel p { margin: 0 0 15px; color: var(--muted); line-height: 1.55; }
    .status-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .status-actions button, .status-actions label { min-height: 38px; padding: 8px 12px; display: inline-grid; place-items: center; color: #0e0b07; font-weight: 750; background: var(--gold-400); border: 1px solid var(--gold-300); cursor: pointer; }
    .status-actions input { display: none; }

    .tooltip { position: fixed; z-index: 60; max-width: 270px; padding: 7px 9px; pointer-events: none; color: var(--ink); font-size: 12px; line-height: 1.25; background: #11100d; border: 1px solid #7e725d; box-shadow: 3px 4px 0 rgba(0,0,0,.45); opacity: 0; transform: translateY(2px); transition: opacity 60ms ease, transform 60ms ease; }
    .tooltip[data-open="true"] { opacity: 1; transform: translateY(0); }
    .tooltip strong { color: #f4e77c; }
    .tooltip span { display: block; margin-top: 3px; color: #bdb3a0; }

    dialog { width: min(680px, calc(100vw - 28px)); max-height: min(760px, calc(100vh - 28px)); padding: 0; overflow: auto; color: var(--ink); background: var(--stone-850); border: 2px solid #8d1008; border-radius: 0; box-shadow: 0 20px 80px rgba(0,0,0,.7), inset 0 1px 0 var(--stone-carve); }
    dialog::backdrop { background: rgba(0,0,0,.72); }
    .dialog-header { position: sticky; top: 0; z-index: 2; min-height: 54px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 12px 10px 18px; background: #2f0905; border-bottom: 1px solid #8d1008; }
    .dialog-header h2 { margin: 0; color: var(--gold-300); font-family: var(--display); font-size: 20px; line-height: 1.2; }
    .dialog-close { width: 36px; height: 34px; color: var(--ink); background: #17120d; border: 1px solid var(--stone-carve); cursor: pointer; }
    .dialog-body { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 20px; padding: 20px; }
    .dialog-art { min-height: 160px; display: grid; place-items: center; background: var(--stone-900); border: 1px solid var(--stone-750); }
    .dialog-art img { max-width: 135px; max-height: 135px; object-fit: contain; }
    .dialog-art .item-fallback { width: 96px; height: 96px; font-size: 24px; }
    .detail-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .detail-table th, .detail-table td { padding: 7px 8px; vertical-align: top; border-bottom: 1px solid #3f3528; }
    .detail-table th { width: 35%; color: var(--muted); font-weight: 650; text-align: left; }
    .detail-table td { color: var(--ink); }
    .detail-table a { overflow-wrap: anywhere; }
    .dialog-description { grid-column: 1 / -1; margin: 0; padding: 12px 14px; color: #d9cfbb; line-height: 1.55; background: var(--stone-900); border: 1px solid var(--stone-750); }

    .visually-hidden { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important; overflow: hidden !important; clip: rect(0 0 0 0) !important; white-space: nowrap !important; border: 0 !important; }
    [hidden] { display: none !important; }

    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .regional-column { border-right: 0; }
      .sidebar { min-height: auto; border-left: 0; border-top: 10px solid #450000; }
      .combo-list { max-height: 560px; }
      .sidebar-footer { min-height: 90px; }
    }

    @media (max-width: 620px) {
      .poster { border-width: 2px; }
      .masthead { min-height: 128px; padding: 22px 14px 18px; }
      .crest-chain img { width: 19px; height: 19px; }
      .league-mark__seal { width: 34px; height: 34px; font-size: 13px; }
      .region-band { min-height: 92px; grid-template-columns: 92px minmax(0, 1fr); }
      .region-identity { padding-inline: 8px; }
      .region-name { left: 7px; font-size: 9px; }
      .region-crest { width: 52px; height: 58px; }
      .region-note { min-width: 150px; }
      .item-button { flex-basis: 48px; width: 48px; height: 60px; }
      .item-button img { max-width: 45px; max-height: 56px; }
      .sidebar-tools { padding-inline: 14px; }
      .combo-list { padding-left: 24px; padding-right: 14px; }
      .dialog-body { grid-template-columns: 1fr; }
      .dialog-art { min-height: 140px; }
      .dialog-description { grid-column: auto; }
    }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="poster" aria-labelledby="page-title">
    <span class="poster-corner" aria-hidden="true"></span>
    <div class="layout">
      <section class="regional-column" aria-label="Regional equipment unlocks">
        <header class="masthead">
          <div>
            <div class="crest-chain" id="crest-chain" aria-hidden="true"></div>
            <h1 class="league-mark" id="page-title">
              <span class="league-mark__top">LEAGUES II</span>
              <span class="league-mark__middle">EQUILIBRIUM</span>
              <span class="league-mark__bottom"><span>Regional</span><span class="league-mark__seal"><span>II</span></span><span>Unlocks</span></span>
            </h1>
          </div>
        </header>
        <div class="region-list" id="region-list" aria-live="polite"></div>
      </section>

      <aside class="sidebar" aria-labelledby="combo-heading">
        <h2 class="sidebar-heading" id="combo-heading">★ Combo Item Unlocks ★</h2>
        <div class="sidebar-tools">
          <label><span class="visually-hidden">Find equipment</span><input class="search-field" id="search" type="search" placeholder="Find an item" autocomplete="off"></label>
          <button class="clear-button" id="clear-search" type="button" aria-label="Clear search">×</button>
        </div>
        <div class="combo-list" id="combo-list"></div>
        <footer class="sidebar-footer">
          <div>
            <strong>Equilibrium II</strong>
            <div id="record-line">Loading equipment…</div>
            <div id="date-line"></div>
            <div><a href="./NOTICE" target="_blank" rel="noreferrer">Sources and licensing</a></div>
            <div>RuneScape is a trademark of Jagex Ltd.</div>
          </div>
          <div class="footer-rune" aria-hidden="true">⚖</div>
        </footer>
      </aside>
    </div>

    <div class="status-overlay" id="status-overlay">
      <section class="status-panel" role="status" aria-live="polite">
        <h2 id="status-title">Loading Equilibrium data</h2>
        <p id="status-copy">Reading the repository’s canonical region, combat-equipment, and local-icon indexes.</p>
        <div class="status-actions" id="status-actions" hidden>
          <button type="button" id="choose-files">Choose JSON files</button>
          <label>Choose JSON files<input id="file-input" type="file" accept="application/json,.json" multiple></label>
        </div>
      </section>
    </div>
  </main>

  <div class="tooltip" id="tooltip" role="tooltip"></div>

  <dialog id="item-dialog" aria-labelledby="dialog-title">
    <header class="dialog-header">
      <h2 id="dialog-title">Equipment</h2>
      <button class="dialog-close" id="dialog-close" type="button" aria-label="Close item details">×</button>
    </header>
    <div class="dialog-body" id="dialog-body"></div>
  </dialog>

  <script>
    (() => {
      "use strict";

      const paths = {
        regions: "./data/league/regions.json",
        equipment: "./data/combat/equipment.json",
        icons: "./data/combat/equipment-icon-slugs.json"
      };

      const regionNotes = {
        misthalin: ["Starting region", "Available from the beginning"],
        havenhythe: ["Starting region", "Available from the beginning"],
        karamja: ["Karamja", "Unlocked automatically early in the League"]
      };

      const elements = {
        regionList: document.querySelector("#region-list"),
        comboList: document.querySelector("#combo-list"),
        crestChain: document.querySelector("#crest-chain"),
        search: document.querySelector("#search"),
        clearSearch: document.querySelector("#clear-search"),
        overlay: document.querySelector("#status-overlay"),
        statusTitle: document.querySelector("#status-title"),
        statusCopy: document.querySelector("#status-copy"),
        statusActions: document.querySelector("#status-actions"),
        chooseFiles: document.querySelector("#choose-files"),
        fileInput: document.querySelector("#file-input"),
        recordLine: document.querySelector("#record-line"),
        dateLine: document.querySelector("#date-line"),
        tooltip: document.querySelector("#tooltip"),
        dialog: document.querySelector("#item-dialog"),
        dialogTitle: document.querySelector("#dialog-title"),
        dialogBody: document.querySelector("#dialog-body"),
        dialogClose: document.querySelector("#dialog-close")
      };

      const state = { regions: [], items: [], itemById: new Map(), iconSlugs: new Set(), query: "", lastTrigger: null };

      const escapeHtml = (value) => String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
      const slugFromId = (id) => String(id || "").replace(/^(?:item|equipment):/, "");
      const initials = (name) => String(name || "?").split(/\s+/).filter(Boolean).slice(0, 3).map((part) => part[0]).join("").toUpperCase();
      const humanize = (value) => String(value || "").replace(/([a-z0-9])([A-Z])/g, "$1 $2").replaceAll("_", " ").replaceAll("-", " ").replace(/\b\w/g, (letter) => letter.toUpperCase());

      function uniqueRecords(records) {
        const seen = new Set();
        return (Array.isArray(records) ? records : []).filter((record) => {
          if (!record?.id || seen.has(record.id)) return false;
          seen.add(record.id);
          return true;
        });
      }

      function iconMarkup(item) {
        const slug = slugFromId(item.id);
        if (state.iconSlugs.has(slug)) {
          return `<img src="./public/game/combat/equipment/${encodeURIComponent(slug)}.webp" alt="" loading="lazy" decoding="async" data-item-image="${escapeHtml(item.id)}">`;
        }
        return `<span class="item-fallback" aria-label="No local icon">${escapeHtml(initials(item.name))}</span>`;
      }

      function regionTag(regionId) {
        const region = state.regions.find((entry) => entry.id === regionId);
        return `<span class="region-tag" data-region="${escapeHtml(regionId)}">${escapeHtml(region?.name || humanize(regionId))}</span>`;
      }

      function itemRegions(item) {
        const regions = item?.unlock?.regions;
        return Array.isArray(regions) ? [...new Set(regions.filter(Boolean))] : [];
      }

      function itemSearchText(item) {
        return [item.name, item.id, item.style, item.slot, item.setId, item.displayDescription, item?.unlock?.requirement, ...itemRegions(item).map((id) => state.regions.find((region) => region.id === id)?.name || id)].filter(Boolean).join(" ").toLowerCase();
      }

      function sortedItems(items) {
        return [...items].sort((a, b) => {
          const tierA = Number.isFinite(Number(a.tier)) ? Number(a.tier) : -1;
          const tierB = Number.isFinite(Number(b.tier)) ? Number(b.tier) : -1;
          return tierB - tierA || String(a.name).localeCompare(String(b.name));
        });
      }

      function renderCrestChain() {
        elements.crestChain.innerHTML = state.regions.map((region) => `<img src="./public/game/regions/${encodeURIComponent(region.id)}.webp" alt="" loading="eager">`).join("");
      }

      function renderRegions() {
        const query = state.query.trim().toLowerCase();
        elements.regionList.innerHTML = state.regions.map((region) => {
          const allRegionItems = state.items.filter((item) => itemRegions(item).includes(region.id));
          const regionItems = sortedItems(allRegionItems).filter((item) => !query || itemSearchText(item).includes(query));
          const note = regionNotes[region.id];
          const itemsHtml = regionItems.map((item) => {
            const combos = itemRegions(item).length;
            return `<button class="item-button" type="button" data-item-id="${escapeHtml(item.id)}" aria-label="${escapeHtml(item.name)}">${iconMarkup(item)}${combos > 1 ? `<span class="combo-mark">${combos}R</span>` : ""}</button>`;
          }).join("");

          return `<section class="region-band" data-region="${escapeHtml(region.id)}" aria-labelledby="region-${escapeHtml(region.id)}">
            <div class="region-identity">
              <h2 class="region-name" id="region-${escapeHtml(region.id)}">${escapeHtml(region.name)}</h2>
              <img class="region-crest" src="./public/game/regions/${encodeURIComponent(region.id)}.webp" alt="" loading="lazy">
              <span class="region-count">${regionItems.length}/${allRegionItems.length}</span>
            </div>
            <div class="region-items" tabindex="0" aria-label="${escapeHtml(region.name)} equipment, horizontally scrollable">
              ${itemsHtml || `<span class="region-note"><strong>No matches</strong><span>Clear the item search to restore this row.</span></span>`}
              ${note ? `<div class="region-note"><strong>${escapeHtml(note[0])}</strong><span>${escapeHtml(note[1])}</span></div>` : ""}
            </div>
          </section>`;
        }).join("");
      }

      function renderCombos() {
        const query = state.query.trim().toLowerCase();
        const combos = sortedItems(state.items.filter((item) => itemRegions(item).length > 1)).filter((item) => !query || itemSearchText(item).includes(query));
        if (!combos.length) {
          elements.comboList.innerHTML = `<p class="combo-empty">${query ? "No combo equipment matches the current search." : "No multi-region equipment is present in the current data snapshot."}</p>`;
          return;
        }
        elements.comboList.innerHTML = combos.map((item) => `<button class="combo-item" type="button" data-item-id="${escapeHtml(item.id)}">
          <span class="combo-icon">${iconMarkup(item)}</span>
          <span class="combo-copy"><span class="combo-name">${escapeHtml(item.name)}</span><span class="region-tags">${itemRegions(item).map(regionTag).join("")}</span></span>
        </button>`).join("");
      }

      function render() {
        renderCrestChain();
        renderRegions();
        renderCombos();
        bindImageFallbacks(document);
      }

      function bindImageFallbacks(root) {
        root.querySelectorAll("img[data-item-image]").forEach((image) => {
          image.addEventListener("error", () => {
            const item = state.itemById.get(image.dataset.itemImage);
            image.replaceWith(createFallback(item?.name));
          }, { once: true });
        });
      }

      function createFallback(name) {
        const span = document.createElement("span");
        span.className = "item-fallback";
        span.setAttribute("aria-label", "No local icon");
        span.textContent = initials(name);
        return span;
      }

      function detailRows(item) {
        const rows = [];
        const add = (label, value) => {
          if (value === undefined || value === null || value === "" || (Array.isArray(value) && !value.length)) return;
          rows.push(`<tr><th scope="row">${escapeHtml(label)}</th><td>${value}</td></tr>`);
        };
        add("Tier", escapeHtml(item.tier));
        add("Combat style", escapeHtml(humanize(item.style)));
        add("Equipment slot", escapeHtml(humanize(item.slot)));
        add("Set", escapeHtml(item.setId));
        add("Unlock type", escapeHtml(humanize(item?.unlock?.type)));
        add("Unlock requirement", escapeHtml(item?.unlock?.requirement));
        add("Regions", itemRegions(item).map(regionTag).join(" "));
        if (item.bonuses && typeof item.bonuses === "object") {
          for (const [key, value] of Object.entries(item.bonuses)) add(humanize(key), escapeHtml(value));
        }
        if (Array.isArray(item.sources) && item.sources.length) {
          const sources = item.sources.map((source) => {
            const label = source.title || humanize(source.source || "Source");
            const date = source.verifiedAt ? ` · verified ${escapeHtml(source.verifiedAt)}` : "";
            if (source.url) return `<a href="${escapeHtml(source.url)}" target="_blank" rel="noreferrer">${escapeHtml(label)}</a>${date}`;
            return `${escapeHtml(label)}${date}`;
          }).join("<br>");
          add("Sources", sources);
        }
        return rows.join("");
      }

      function openItem(itemId, trigger = null) {
        const item = state.itemById.get(itemId);
        if (!item) return;
        state.lastTrigger = trigger || document.activeElement;
        elements.dialogTitle.textContent = item.name;
        elements.dialogBody.innerHTML = `<div class="dialog-art">${iconMarkup(item)}</div><table class="detail-table"><tbody>${detailRows(item)}</tbody></table>${item.displayDescription ? `<p class="dialog-description">${escapeHtml(item.displayDescription)}</p>` : ""}`;
        bindImageFallbacks(elements.dialogBody);
        elements.dialog.showModal();
        const url = new URL(location.href);
        url.searchParams.set("item", item.id);
        history.replaceState(null, "", url);
      }

      function closeItem() {
        if (elements.dialog.open) elements.dialog.close();
        const url = new URL(location.href);
        url.searchParams.delete("item");
        history.replaceState(null, "", url);
        state.lastTrigger?.focus?.();
      }

      function showTooltip(button, event) {
        const item = state.itemById.get(button.dataset.itemId);
        if (!item) return;
        const regions = itemRegions(item).map((id) => state.regions.find((region) => region.id === id)?.name || humanize(id)).join(" + ");
        elements.tooltip.innerHTML = `<strong>${escapeHtml(item.name)}</strong><span>${item.tier ? `Tier ${escapeHtml(item.tier)} · ` : ""}${escapeHtml(humanize(item.style || item.slot || "Combat equipment"))}${regions ? ` · ${escapeHtml(regions)}` : ""}</span>`;
        positionTooltip(event.clientX, event.clientY);
        elements.tooltip.dataset.open = "true";
      }

      function positionTooltip(x, y) {
        const margin = 14;
        const rect = elements.tooltip.getBoundingClientRect();
        const left = Math.min(x + margin, window.innerWidth - rect.width - 8);
        const top = Math.min(y + margin, window.innerHeight - rect.height - 8);
        elements.tooltip.style.left = `${Math.max(8, left)}px`;
        elements.tooltip.style.top = `${Math.max(8, top)}px`;
      }

      function hideTooltip() { elements.tooltip.dataset.open = "false"; }

      function acceptData(regionsData, equipmentData, iconsData) {
        const regions = Array.isArray(regionsData) ? regionsData : regionsData?.records;
        const records = Array.isArray(equipmentData) ? equipmentData : equipmentData?.records;
        if (!Array.isArray(regions) || !Array.isArray(records) || !Array.isArray(iconsData)) throw new Error("The selected files do not contain the expected Equilibrium data structures.");
        state.regions = regions.filter((region) => region?.id && region?.name);
        state.items = uniqueRecords(records);
        state.itemById = new Map(state.items.map((item) => [item.id, item]));
        state.iconSlugs = new Set(iconsData);
        elements.recordLine.textContent = `${state.items.length} unique combat items · ${state.items.filter((item) => state.iconSlugs.has(slugFromId(item.id))).length} local icons`;
        const date = equipmentData?.lastSynced || equipmentData?.snapshotDate || regionsData?.lastSynced || regionsData?.snapshotDate;
        elements.dateLine.textContent = date ? `Updated: ${date}` : "";
        elements.overlay.hidden = true;
        render();
        const requestedItem = new URL(location.href).searchParams.get("item");
        if (requestedItem && state.itemById.has(requestedItem)) openItem(requestedItem);
      }

      async function fetchJson(path) {
        const response = await fetch(path, { cache: "no-store" });
        if (!response.ok) throw new Error(`${path}: ${response.status}`);
        return response.json();
      }

      async function loadRepositoryData() {
        try {
          const [regions, equipment, icons] = await Promise.all([fetchJson(paths.regions), fetchJson(paths.equipment), fetchJson(paths.icons)]);
          acceptData(regions, equipment, icons);
        } catch (error) {
          elements.statusTitle.textContent = "Open the repository data";
          elements.statusCopy.textContent = "Your browser blocked local JSON loading. Select regions.json, equipment.json, and equipment-icon-slugs.json from this repository, or serve the repository root with a basic local HTTP server.";
          elements.statusActions.hidden = false;
          console.warn("Repository data could not be loaded automatically.", error);
        }
      }

      async function readSelectedFiles(files) {
        const parsed = new Map();
        for (const file of files) {
          if (!file.name.endsWith(".json")) continue;
          parsed.set(file.name, JSON.parse(await file.text()));
        }
        const regions = parsed.get("regions.json");
        const equipment = parsed.get("equipment.json");
        const icons = parsed.get("equipment-icon-slugs.json");
        if (!regions || !equipment || !icons) throw new Error("Select all three required JSON files.");
        acceptData(regions, equipment, icons);
      }

      elements.search.addEventListener("input", () => {
        state.query = elements.search.value;
        renderRegions();
        renderCombos();
        bindImageFallbacks(document);
      });

      elements.clearSearch.addEventListener("click", () => {
        elements.search.value = "";
        state.query = "";
        renderRegions();
        renderCombos();
        bindImageFallbacks(document);
        elements.search.focus();
      });

      document.addEventListener("click", (event) => {
        const button = event.target.closest("[data-item-id]");
        if (button) openItem(button.dataset.itemId, button);
      });

      document.addEventListener("pointerover", (event) => {
        const button = event.target.closest(".item-button, .combo-item");
        if (button) showTooltip(button, event);
      });

      document.addEventListener("pointermove", (event) => {
        if (elements.tooltip.dataset.open === "true") positionTooltip(event.clientX, event.clientY);
      });

      document.addEventListener("pointerout", (event) => {
        if (event.target.closest(".item-button, .combo-item")) hideTooltip();
      });

      elements.dialogClose.addEventListener("click", closeItem);
      elements.dialog.addEventListener("cancel", (event) => { event.preventDefault(); closeItem(); });
      elements.dialog.addEventListener("click", (event) => { if (event.target === elements.dialog) closeItem(); });

      elements.chooseFiles.addEventListener("click", async () => {
        if (!("showOpenFilePicker" in window)) { elements.fileInput.click(); return; }
        try {
          const handles = await window.showOpenFilePicker({ multiple: true, types: [{ description: "Equilibrium JSON", accept: { "application/json": [".json"] } }] });
          const files = await Promise.all(handles.map((handle) => handle.getFile()));
          await readSelectedFiles(files);
        } catch (error) {
          if (error?.name !== "AbortError") elements.statusCopy.textContent = error.message;
        }
      });

      elements.fileInput.addEventListener("change", async () => {
        try { await readSelectedFiles([...elements.fileInput.files]); }
        catch (error) { elements.statusCopy.textContent = error.message; }
      });

      loadRepositoryData();
    })();
  </script>
</body>
</html>
